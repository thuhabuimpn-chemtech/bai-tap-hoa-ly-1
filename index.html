function pathCheck(pt,P,errs){const path=PATHS[pt.path];const X=p2Cross(path);const n=X.length,k=P.res.mk.length;
  if(!k)return 'Hãy bấm lên đường đi để đánh dấu các điểm chuyển pha.';
  if(k!==n){errs.push([`Đường đi S → E cắt ${n} đường cân bằng pha, bạn đã đánh dấu ${k} điểm.`,'path-cross',k<n?'Đi dọc mũi tên và đếm lần lượt mọi đường cong mà nó cắt qua.':'Chỉ đánh dấu tại chỗ mũi tên cắt đường cân bằng; trong một vùng thì hệ chỉ có một pha.']);qzCheck(pt,P,errs);return true;}
  for(let j=0;j<=k;j++)if(!P.res.seg[j]||(j<k&&(!P.res.tr[j]||!P.res.val[j])))return 'Hãy chọn đủ pha cho mọi đoạn, loại chuyển pha và giá trị cho mọi điểm.';
  if(pt.qz&&P.res.qz.some(x=>x==null))return 'Hãy trả lời đủ các câu hỏi.';
  P.res.mk.forEach((s,j)=>{if(Math.abs(s-X[j])>14){P.res.bad['x'+j]=1;errs.push([`Điểm ${j+1} chưa đặt đúng chỗ giao với đường cân bằng.`,'path-cross','']);}});
  for(let j=0;j<=k;j++)if(P.res.seg[j]!==path.ph[j]){P.res.bad['s'+j]=1;errs.push([`Đoạn ${j?j:'S'} → ${j===k?'E':j+1}: pha chưa đúng.`,'diag-read','Một vùng trên giản đồ ứng với một pha bền.']);}
  for(let j=0;j<k;j++){const e=[];if(P.res.tr[j]!==TRANS[path.x[j].tr])e.push('loại chuyển pha');if(P.res.val[j]!==path.x[j].v)e.push(path.dir==='h'?'nhiệt độ':'áp suất');
    if(e.length){P.res.bad['x'+j]=1;errs.push([`Điểm ${j+1}: ${e.join(' và ')} chưa đúng.`,'diag-read',path.dir==='h'?'Đi theo chiều tăng nhiệt độ: chuyển từ pha của đoạn trước sang pha của đoạn sau.':'Đi theo chiều tăng áp suất: chuyển từ pha của đoạn dưới sang pha của đoạn trên.']);}}
  qzCheck(pt,P,errs);return true;}

/* --- Ý dựng đường đun nóng --- */
function hcTruth(path){const t=[];path.ph.forEach((ph,j)=>{t.push({t:'u',v:ph});if(j<path.x.length)t.push({t:'f',v:path.x[j].v});});return t;}
function hcRange(path,sc){const Ts=[sc[path.T0],sc[path.T1],...path.x.map(x=>x.T)];const lo=Math.min(...Ts),hi=Math.max(...Ts),pd=(hi-lo)*0.08;return [lo-pd,hi+pd];}
function hcSVG(path,sc,pts,o={}){const [lo,hi]=hcRange(path,sc);const xm=o.xmax||Math.max(1,pts.length?pts[pts.length-1].x:1);
  const X=x=>56+x/xm*340,Y=T=>292-(T-lo)/(hi-lo)*270;const L=[`<svg class="dg hc" viewBox="0 0 420 330" role="img" aria-label="${o.aria||'Đường đun nóng: nhiệt độ theo nhiệt lượng cấp vào'}">`];
  L.push(`<line x1="56" y1="300" x2="404" y2="300" class="frame"/><line x1="56" y1="300" x2="56" y2="12" class="frame"/><text x="404" y="322" class="ax" text-anchor="end">${o.xlab||'Nhiệt lượng cấp vào →'}</text><text x="62" y="20" class="ax"><tspan font-style="italic">T</tspan> (°C)</text>`);
  const ticks=[...new Set([sc[path.T0],...path.x.map(x=>x.T),sc[path.T1]])];
  let lastY=-99;ticks.sort((a,b)=>a-b).forEach(T=>{const y=Y(T);L.push(`<line x1="52" y1="${y}" x2="404" y2="${y}" class="g2"/>`);if(Math.abs(y-lastY)>11){L.push(`<text x="48" y="${y+4}" class="tk" text-anchor="end">${fmt(T,4)}</text>`);lastY=y;}});
  if(o.xt)o.xt.forEach(([x,lab])=>L.push(`<text x="${X(x)}" y="314" class="tk" text-anchor="middle">${lab}</text>`));
  for(let j=1;j<pts.length;j++){const a=pts[j-1],b=pts[j];L.push(`<line x1="${X(a.x)}" y1="${Y(a.T)}" x2="${X(b.x)}" y2="${Y(b.T)}" class="${b.k==='f'?'hcf':'hcu'}${b.dash?' hcd':''}"/>`);
    if(b.lab){const mx=(X(a.x)+X(b.x))/2,my=(Y(a.T)+Y(b.T))/2;const fl=b.k==='f',rt=!fl&&mx>350;L.push(`<text x="${fl?mx:rt?mx-6:mx+6}" y="${my-7}" class="hcl" text-anchor="${fl?'middle':rt?'end':'start'}">${b.lab}</text>`);}}
  if(pts.length)L.push(`<circle cx="${X(pts[0].x)}" cy="${Y(pts[0].T)}" r="4" class="pth-s"/>`);
  if(o.cur!=null){const c=o.cur;L.push(`<line x1="${X(c.x)}" y1="300" x2="${X(c.x)}" y2="12" class="ds"/><circle cx="${X(c.x)}" cy="${Y(c.T)}" r="7" class="mv"/>`);}
  L.push('</svg>');return L.join('');}
function hcUserPts(path,hs,sc){const [lo,hi]=hcRange(path,sc);const pts=[{x:0,T:sc[path.T0]}];let T=sc[path.T0];
  hs.forEach((it,j)=>{if(it.t==='f'){const v=it.v?tval(it.v):T;pts.push({x:j+1,T:v,k:'f',dash:!it.v,lab:it.v?'':'?'});T=v;}
    else{const nx=hs[j+1];let tg;if(nx&&nx.t==='f'&&nx.v)tg=tval(nx.v);else if(j===hs.length-1)tg=sc[path.T1];else tg=Math.min(hi,T+(hi-lo)*0.15);
      pts.push({x:j+1,T:tg,k:'u',dash:!it.v,lab:it.v||'?'});T=tg;}});
  return pts;}
function hcBody(pt,P,done){const path=PATHS[pt.path],sc=cur.scope;let h='';
  if(!done){const hs=P.res.hs;const bad=P.res.bad||{};
    h+=`<div class="dgw">${hcSVG(path,sc,hcUserPts(path,hs,sc),{xmax:Math.max(5,hs.length)})}</div>`;
    h+=`<ol class="hcl-list">${hs.map((it,j)=>`<li class="${bad[j]?'bad':''}"><span class="hc-ic ${it.t}" aria-hidden="true">${it.t==='u'?'↗':'→'}</span>${it.t==='u'?'Đoạn đi lên — đun nóng pha ':'Đoạn nằm ngang — chuyển pha ở '}${selHtml('data-hs',j,it.t==='u'?PTR[path.dg].ph:path.vals,it.v,'Đoạn '+(j+1))}</li>`).join('')}</ol>`;
    h+=`<div class="row hc-btns"><button class="btn small" type="button" data-hc="u">＋ Đoạn đi lên</button><button class="btn small" type="button" data-hc="f">＋ Đoạn nằm ngang</button>${hs.length?'<button class="btn small ghost" type="button" data-hc="pop">Xóa đoạn cuối</button>':''}</div>
     <p class="small muted">Đường bắt đầu tại S (${fmt(sc[path.T0],4)} °C) và kết thúc tại E (${fmt(sc[path.T1],4)} °C). Đoạn đi lên: nhiệt độ tăng khi đun nóng một pha; đoạn nằm ngang: nhiệt độ không đổi trong khi chuyển pha.</p>`;}
  else{const M=simModel(path,sc);const pts=simPts(M);
    h+=`<div class="dgw">${hcSVG(path,sc,pts,{xmax:M.tot,xlab:path.qu?`Nhiệt lượng cấp vào (${path.qu}) →`:'Nhiệt lượng cấp vào (không theo tỉ lệ) →',xt:path.qu?simXt(M):null})}</div>`;
    if(path.qu)h+=`<p class="small muted">Vẽ đúng tỉ lệ với ${fmt(sc.n,3)} mol nước: các đoạn nằm ngang dài ${fmt(M.segs[1].w,4)} kJ (nóng chảy) và ${fmt(M.segs[3].w,4)} kJ (hóa hơi).</p>`;
    else h+=`<p class="small muted">Đường đun nóng định tính: độ dài các đoạn chỉ thể hiện thứ tự lớn nhỏ của nhiệt lượng.</p>`;}
  h+=qzHtml(pt,P,done);
  if(done&&pt.sim)h+=simHtml(pt.path);
  return h;}
function hcCheck(pt,P,errs){const path=PATHS[pt.path];const tr=hcTruth(path);const hs=P.res.hs;
  if(!hs.length)return 'Hãy ghép các đoạn của đường đun nóng.';
  if(hs.some(x=>!x.v))return 'Hãy chọn pha hoặc nhiệt độ cho mọi đoạn.';
  if(pt.qz&&P.res.qz.some(x=>x==null))return 'Hãy trả lời đủ các câu hỏi.';
  const nf=tr.filter(x=>x.t==='f').length,uf=hs.filter(x=>x.t==='f').length;
  const shape=hs.map(x=>x.t).join(''),tshape=tr.map(x=>x.t).join('');
  if(shape!==tshape){
    if(uf<nf)errs.push([`Đường đi cắt ${nf} đường cân bằng nên đường đun nóng phải có ${nf} đoạn nằm ngang; bạn mới có ${uf}.`,'latent','Mỗi lần chuyển pha ở áp suất không đổi, nhiệt độ đứng yên cho đến khi chuyển pha xong.']);
    else if(uf>nf)errs.push([`Chỉ có ${nf} lần chuyển pha nên chỉ có ${nf} đoạn nằm ngang; bạn có ${uf}.`,'path-cross','']);
    else errs.push(['Thứ tự các đoạn chưa đúng: đoạn đi lên (một pha) và đoạn nằm ngang (chuyển pha) phải xen kẽ, bắt đầu và kết thúc bằng đoạn đi lên.','path-cross','']);
    qzCheck(pt,P,errs);return true;}
  hs.forEach((it,j)=>{if(it.v!==tr[j].v){P.res.bad[j]=1;errs.push(it.t==='u'?[`Đoạn ${j+1}: pha đang được đun nóng chưa đúng.`,'diag-read','Đối chiếu với các đoạn của đường đi ở ý trước.']:[`Đoạn ${j+1}: nhiệt độ chuyển pha chưa đúng.`,'diag-read','Đọc nhiệt độ tại giao điểm của đường đẳng áp với đường cân bằng.']);}});
  qzCheck(pt,P,errs);return true;}

/* --- Mô hình mô phỏng --- */
function simModel(path,sc){const X=p2Cross(path);const n=path.ph.length;const W=path.wf?path.wf(sc):path.w;const segs=[];let k=0;
  const T0=path.dir==='h'?sc[path.T0]:null,T1=path.dir==='h'?sc[path.T1]:null;
  for(let j=0;j<n;j++){const s0=j?X[j-1]:path.a,s1=j<n-1?X[j]:path.b;
    segs.push({k:'u',ph:path.ph[j],s0,s1,T0:j?path.x[j-1].T:T0,T1:j<n-1?path.x[j].T:T1,w:W[k++],j});
    if(j<n-1)segs.push({k:'f',from:path.ph[j],to:path.ph[j+1],s0:X[j],s1:X[j],T0:path.x[j].T,T1:path.x[j].T,w:W[k++],x:path.x[j],j});}
  let c=0;segs.forEach(s=>{s.q0=c;c+=s.w;s.q1=c;});return {segs,tot:c,path,sc};}
function simPts(M){const p=[{x:0,T:M.segs[0].T0}];M.segs.forEach(s=>p.push({x:s.q1,T:s.T1,k:s.k,lab:s.k==='u'?s.ph:M.path.qu?fmt(s.w,3)+' '+M.path.qu:''}));return p;}
function simXt(M){return [[0,'0'],[M.tot,fmt(M.tot,4)]];}
function simAt(M,u){const q=Math.max(0,Math.min(1,u))*M.tot;const s=M.segs.find(x=>q<=x.q1+1e-9)||M.segs[M.segs.length-1];const f=s.w?(q-s.q0)/s.w:1;
  return {s,f,q,T:s.T0!=null?s.T0+(s.T1-s.T0)*f:null,pos:s.s0+(s.s1-s.s0)*f};}
const PHK={'rắn':'s','S tà phương':'s','S đơn tà':'s2','lỏng':'l','hơi':'g','khí':'g'};
const CYLC={h2o:{s:'#CDEBF8',l:'#3E8EDE',g:'#6FAEE6',H:{s:34,l:31},float:true},co2:{s:'#E6ECF1',l:'#8EC3E6',g:'#8A9BAD',H:{s:30,l:34}},s:{s:'#F2D43D',s2:'#E7A43A',l:'#C25A1E',g:'#D9A441',H:{s:32,s2:33,l:35}}};
function rnd1(i){const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x);}
function cylSVG(path,st,tm,M){const C=CYLC[path.dg];const s=st.s;const amt={};
  if(s.k==='u')amt[s.ph]=1;else{amt[s.from]=1-st.f;amt[s.to]=(amt[s.to]||0)+st.f;}
  const x0=34,x1=136,yb=214,W=x1-x0;let gas=0;const cond=[];
  for(const [ph,a] of Object.entries(amt)){if(a<=1e-6)continue;const kd=PHK[ph];if(kd==='g')gas+=a;else cond.push({ph,kd,h:a*C.H[kd]});}
  let gh=0;if(gas>0){if(path.dir==='h'){const gi=M.segs.findIndex(x=>x.k==='f'&&PHK[x.to]==='g');const Tg=gi>=0?M.segs[gi].T0:st.T;const Te=M.segs[M.segs.length-1].T1;
      gh=gas*(78+42*Math.max(0,Math.min(1,(st.T-Tg)/((Te-Tg)||1))));}
    else{const s0=M.segs[0];gh=s.j===0&&s.k==='u'?140-(140-62)*st.f:62*gas;}}
  if(C.float)cond.sort((a,b)=>(a.kd==='l'?0:1)-(b.kd==='l'?0:1));else cond.sort((a,b)=>(a.kd==='l'?1:0)-(b.kd==='l'?1:0));
  const L=[`<svg class="dg cyl" viewBox="0 0 170 272" role="img" aria-label="Xi lanh có piston: các pha trong hệ">`];
  L.push(`<rect x="${x0-4}" y="22" width="${W+8}" height="${yb-18}" rx="4" class="cyl-w"/>`);
  let y=yb;const mv=!RM()&&tm!=null;
  cond.forEach((c,ci)=>{const top=y-c.h;L.push(`<rect x="${x0}" y="${top}" width="${W}" height="${c.h}" fill="${C[c.kd]}" class="cyl-l"/>`);
    if(c.kd==='l'){const nn=Math.round(W*c.h/40);for(let i=0;i<nn;i++){const bx=x0+4+rnd1(i+ci*97)*(W-8),by=top+3+rnd1(i*3+7+ci*13)*(c.h-6);const jx=mv?Math.sin(tm*3+i)*1.6:0,jy=mv?Math.cos(tm*2.6+i*1.7)*1.3:0;L.push(`<circle cx="${(bx+jx).toFixed(1)}" cy="${(by+jy).toFixed(1)}" r="2.2" class="cyl-p"/>`);}}
    else{for(let yy=top+4;yy<y-3;yy+=8)for(let xx=x0+5;xx<x1-3;xx+=9){const jx=mv?Math.sin(tm*9+xx+yy)*0.5:0;L.push(`<rect x="${(xx+jx).toFixed(1)}" y="${yy}" width="5" height="5" class="cyl-q"/>`);}}
    y=top;});
  const gtop=y-gh;
  if(gh>0){const nn=Math.max(3,Math.round(22*gas));for(let i=0;i<nn;i++){let bx=x0+5+rnd1(i+500)*(W-10),by=gtop+5+rnd1(i+900)*(gh-10);
      if(mv){bx=x0+5+((bx-x0-5+tm*30*(rnd1(i+41)-0.5)*2)%(W-10)+(W-10))%(W-10);by=gtop+5+((by-gtop-5+tm*26*(rnd1(i+77)-0.5)*2)%Math.max(1,gh-10)+Math.max(1,gh-10))%Math.max(1,gh-10);}
      L.push(`<circle cx="${bx.toFixed(1)}" cy="${by.toFixed(1)}" r="2.4" fill="${C.g}"/>`);}}
  const py=gtop;L.push(`<rect x="${x0-1}" y="${py-9}" width="${W+2}" height="9" rx="2" class="cyl-pi"/><line x1="${(x0+x1)/2}" y1="${py-9}" x2="${(x0+x1)/2}" y2="6" class="cyl-rod"/>`);
  if(path.dir==='v')L.push(`<path d="M${(x0+x1)/2-14},10 l14,12 l14,-12" class="cyl-ar"/>`);
  else{const fl=mv?1+0.12*Math.sin(tm*14):1;L.push(`<g transform="translate(${(x0+x1)/2} ${yb+14}) scale(1 ${fl.toFixed(2)})"><path d="M-30,24 Q-24,4 -18,24 Q-10,0 -2,24 Q6,2 12,24 Q20,6 28,24 Z" class="cyl-fl"/></g>`);}
  L.push(`<text x="85" y="${yb+54}" class="tk" text-anchor="middle">${path.dir==='h'?'P = const':'T = '+path.tl}</text></svg>`);return L.join('');}
function simHtml(pk){return `<div class="sim" data-sim="${pk}"><p class="lbl">Mô phỏng quá trình</p><div class="sim-g"><div class="sim-d"></div><div class="sim-c"></div>${PATHS[pk].dir==='h'?'<div class="sim-h"></div>':''}</div>
  <div class="sim-ctl"><button class="btn small primary" type="button" data-sp>▶ Chạy</button><input type="range" min="0" max="1000" value="0" data-sr aria-label="Tiến trình quá trình"><span class="sim-pc small muted"></span></div><p class="sim-st" aria-live="polite"></p></div>`;}
function simBind(box){const path=PATHS[box.dataset.sim];const M=simModel(path,cur.scope);const r=box.querySelector('[data-sr]'),b=box.querySelector('[data-sp]');let raf=0,t0=0,u0=0,tm=null;
  const draw=()=>{const u=r.value/1000;const st=simAt(M,u);const s=st.s;
    box.querySelector('.sim-d').innerHTML=p2SVG(path,{done:true,sc:cur.scope,mk:p2Cross(path),dot:p2XY(path,st.pos)});
    box.querySelector('.sim-c').innerHTML=cylSVG(path,st,tm,M);
    const hh=box.querySelector('.sim-h');if(hh)hh.innerHTML=hcSVG(path,cur.scope,simPts(M),{xmax:M.tot,cur:{x:st.q,T:st.T},xlab:path.qu?`Nhiệt lượng cấp vào (${path.qu}) →`:'Nhiệt lượng cấp vào →'});
    const fz=s.k==='u'?1:2;const cc=1-fz+1;
    box.querySelector('.sim-st').innerHTML=s.k==='u'?`<b>Một pha: ${s.ph}.</b> ${path.dir==='h'?`Nhiệt độ tăng: <i>T</i> = ${fmt(st.T,3)} °C.`:'Áp suất tăng, thể tích giảm.'} Bậc tự do (${path.dir==='h'?'<i>P</i>':'<i>T</i>'} cố định): <i>c</i> = 1 − 1 + 1 = ${cc}.`
      :`<b>Hai pha: ${s.from} + ${s.to}</b> — ${TRANS[s.x.tr].split(' (')[0]} tại ${s.x.v}, đã chuyển ${Math.round(st.f*100)} %. ${path.dir==='h'?'Nhiệt độ đứng yên dù vẫn cấp nhiệt':'Áp suất đứng yên dù vẫn nén'}: <i>c</i> = 1 − 2 + 1 = ${cc}.`;
    box.querySelector('.sim-pc').textContent=path.qu?`Q = ${fmt(st.q,3).replace(/<[^>]+>/g,'')} kJ`:`${Math.round(u*100)} %`;};
  const stop=()=>{cancelAnimationFrame(raf);raf=0;tm=null;b.textContent='▶ Chạy';draw();};
  const step=ts=>{if(!box.isConnected){cancelAnimationFrame(raf);return;}if(!t0)t0=ts;const u=u0+(ts-t0)/14000;tm=ts/1000;if(u>=1){r.value=1000;stop();return;}r.value=Math.round(u*1000);draw();raf=requestAnimationFrame(step);};
  b.addEventListener('click',()=>{if(raf){stop();return;}if(+r.value>=1000)r.value=0;u0=r.value/1000;t0=0;b.textContent='❚❚ Dừng';raf=requestAnimationFrame(step);});
  r.addEventListener('input',()=>{if(raf){cancelAnimationFrame(raf);raf=0;b.textContent='▶ Chạy';tm=null;}draw();});
  draw();}

/* --- Gắn sự kiện cho hai dạng mới --- */
function bindD2(el,i,pt,P,done){
  const svg=el.querySelector('.clickp svg');const path=PATHS[pt.path];
  if(svg&&pt.kind==='path')svg.addEventListener('click',e=>{const pnt=svg.createSVGPoint();pnt.x=e.clientX;pnt.y=e.clientY;const q=pnt.matrixTransform(svg.getScreenCTM().inverse());
    const h=path.dir==='h';const d=h?Math.abs(q.y-path.at):Math.abs(q.x-path.at);if(d>22)return;
    const lo=Math.min(path.a,path.b)+4,hi=Math.max(path.a,path.b)-4;const s=Math.max(lo,Math.min(hi,h?q.x:q.y));
    const ix=P.res.mk.findIndex(m=>Math.abs(m-s)<10);
    if(ix>=0){P.res.mk.splice(ix,1);}else{P.res.mk.push(s);P.res.mk.sort((a,b)=>p2u(path,a)-p2u(path,b));}
    renderDiag(i);});
  el.querySelectorAll('select[data-ps]').forEach(x=>x.addEventListener('change',()=>{P.res.seg[+x.dataset.ps]=x.value;}));
  el.querySelectorAll('select[data-pt]').forEach(x=>x.addEventListener('change',()=>{P.res.tr[+x.dataset.pt]=x.value;}));
  el.querySelectorAll('select[data-pv]').forEach(x=>x.addEventListener('change',()=>{P.res.val[+x.dataset.pv]=x.value;}));
  el.querySelectorAll('select[data-hs]').forEach(x=>x.addEventListener('change',()=>{P.res.hs[+x.dataset.hs].v=x.value;P.res.bad={};renderDiag(i);}));

/* ===== Chương 6: các dạng giản đồ dung dịch – hơi ===== */
const D6={};
function opt6(attr,val,opts,lab){return `<select ${attr} aria-label="${lab}"><option value="">chọn…</option>${opts.map(o=>`<option ${val===o?'selected':''}>${o}</option>`).join('')}</select>`;}
function svgPt(svg,e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse());}

/* --- 1. Nhận biết sai lệch so với Raoult (P–x theo Margules) --- */
const DEVT=['Sai lệch âm','Sai lệch dương','Lý tưởng'];
const DEVA={'Sai lệch âm':-1.4,'Sai lệch dương':1.4,'Lý tưởng':0};
const DEVP=[[0.45,0.95],[0.32,1.05],[0.55,0.88]];
function devSVG(type,k,lab){const A=DEVA[type];const [pa,pb]=DEVP[k];const X=x=>34+x*150,Y=p=>150-p*112;
  const L=[`<svg class="dg dev" viewBox="0 0 200 178" role="img" aria-label="Giản đồ P–x ${lab}">`];
  L.push(`<line x1="34" y1="150" x2="184" y2="150" class="frame"/><line x1="34" y1="150" x2="34" y2="10" class="frame"/><line x1="184" y1="150" x2="184" y2="10" class="frame2"/>`);
  L.push(`<text x="34" y="166" class="tk" text-anchor="middle">A</text><text x="184" y="166" class="tk" text-anchor="middle">B</text><text x="109" y="170" class="tk" text-anchor="middle">x<tspan font-size="8">B</tspan> →</text><text x="40" y="20" class="ax">P</text><text x="6" y="16" class="vx">${lab})</text>`);
  L.push(`<line x1="${X(0)}" y1="${Y(pa)}" x2="${X(1)}" y2="${Y(pb)}" class="dvd"/><line x1="${X(0)}" y1="${Y(0)}" x2="${X(1)}" y2="${Y(pb)}" class="dvd"/><line x1="${X(0)}" y1="${Y(pa)}" x2="${X(1)}" y2="${Y(0)}" class="dvd"/>`);
  let dt='',dA='',dB='';for(let i=0;i<=40;i++){const x=i/40,xa=1-x;const gA=Math.exp(A*x*x),gB=Math.exp(A*xa*xa);const p1=xa*gA*pa,p2=x*gB*pb;
    dt+=(i?' L':'M')+X(x).toFixed(1)+','+Y(p1+p2).toFixed(1);dA+=(i?' L':'M')+X(x).toFixed(1)+','+Y(p1).toFixed(1);dB+=(i?' L':'M')+X(x).toFixed(1)+','+Y(p2).toFixed(1);}
  L.push(`<path d="${dt}" class="dvt"/><path d="${dA}" class="dvp"/><path d="${dB}" class="dvp"/></svg>`);return L.join('');}
D6.dev={badge:'Nhận biết sai lệch',

  h=fill(h,sc);
  h+=`<p class="small muted">Ba giản đồ <i>P</i>–<i>x</i> dưới đây: đường liền đậm là áp suất tổng, đường liền mảnh là hai áp suất riêng phần, đường nét đứt là giá trị theo định luật Raoult. Chọn loại dung dịch cho mỗi giản đồ.</p><div class="devg">${['a','b','c'].map((l,k)=>`<figure class="${!done&&bad['p'+k]?'bad':''}">${devSVG(P.res.ty[k],k,l)}<figcaption>${done?`<b>${P.res.ty[k]}</b>`:opt6(`data-dp="${k}"`,P.res.ps[k],DEVT,'Giản đồ '+l)}</figcaption></figure>`).join('')}</div>`;

/* --- 2. Giản đồ P–x–y của dung dịch lý tưởng: đường nối pha và quy tắc đòn bẩy --- */
function vleGeo(sc){const Pm=sc.PA*1.1;return {X:x=>50+x*340,Y:p=>292-p/Pm*272,iX:px=>(px-50)/340,iY:py=>(292-py)/272*Pm,Pm};}
const pDew=(sc,y)=>1/((1-y)/sc.PA+y/sc.PB);
function vleSVG(sc,o){const G=vleGeo(sc);const {X,Y}=G;const L=[`<svg class="dg vle" viewBox="0 0 420 330" role="img" aria-label="Giản đồ P–x–y của dung dịch lý tưởng hai cấu tử">`];
  for(let k=0;k<=10;k++)L.push(`<line x1="${X(k/10)}" y1="${Y(0)}" x2="${X(k/10)}" y2="${Y(G.Pm)}" class="${k%5?'g2':'g'}"/>`);
  const st=sc.PA>600?100:50;for(let p=0;p<=G.Pm;p+=st){L.push(`<line x1="${X(0)}" y1="${Y(p)}" x2="${X(1)}" y2="${Y(p)}" class="g2"/><text x="${X(0)-5}" y="${Y(p)+4}" class="tk" text-anchor="end">${p}</text><text x="${X(1)+5}" y="${Y(p)+4}" class="tk">${p}</text><line x1="${X(0)-4}" y1="${Y(p)}" x2="${X(0)}" y2="${Y(p)}" class="frame"/><line x1="${X(1)}" y1="${Y(p)}" x2="${X(1)+4}" y2="${Y(p)}" class="frame"/>`);}
  L.push(`<line x1="${X(0)}" y1="${Y(0)}" x2="${X(0)}" y2="${Y(G.Pm)}" class="frame"/><line x1="${X(1)}" y1="${Y(0)}" x2="${X(1)}" y2="${Y(G.Pm)}" class="frame"/><line x1="${X(0)}" y1="${Y(0)}" x2="${X(1)}" y2="${Y(0)}" class="frame"/>`);
  for(let k=0;k<=10;k+=2)L.push(`<text x="${X(k/10)}" y="${Y(0)+15}" class="tk" text-anchor="middle">${fmt(k/10,2)}</text>`);
  L.push(`<rect x="${X(0)}" y="${Y(G.Pm)}" width="340" height="${Y(0)-Y(G.Pm)}" class="frame2"/><text x="${X(1)}" y="${Y(0)+30}" class="ax" text-anchor="end">xˡ<tspan font-size="9">B</tspan>, xʰ<tspan font-size="9">B</tspan> (${sc.nB||'B'}) →</text><text x="${X(0)}" y="12" class="ax">P (mmHg)</text>`);
  L.push(`<text x="${X(0)-4}" y="${Y(0)+30}" class="tk">${sc.nA||'A'}</text>`);
  L.push(`<line x1="${X(0)}" y1="${Y(sc.PA)}" x2="${X(1)}" y2="${Y(sc.PB)}" class="cv"/>`);
  let d='';for(let i=0;i<=60;i++){const y=i/60;d+=(i?' L':'M')+X(y).toFixed(1)+','+Y(pDew(sc,y)).toFixed(1);}L.push(`<path d="${d}" class="cv cvd"/>`);
  L.push(`<text x="${X(0)+6}" y="${Y(sc.PA)-6}" class="lm">P°<tspan font-size="8">A</tspan> = ${fmt(sc.PA,4)}</text><text x="${X(1)-6}" y="${Y(sc.PB)-8}" class="lm" text-anchor="end">P°<tspan font-size="8">B</tspan> = ${fmt(sc.PB,4)}</text>`);
  if(o.lab)L.push(`<text x="${X(0.72)}" y="${Y(sc.PA*0.93)}" class="rg">Lỏng</text><text x="${X(0.12)}" y="${Y(sc.PB*0.55)}" class="rg">Hơi</text>`);{const Pp=o.P!=null?o.P:sc.P;const mid=x=>(sc.PA+(sc.PB-sc.PA)*x+pDew(sc,x))/2;const xs=Math.abs(mid(0.75)-Pp)>Math.abs(mid(0.3)-Pp)?0.75:0.3;L.push(`<text x="${X(xs)}" y="${Y(mid(xs))+4}" class="rg" text-anchor="middle">L + H</text>`);}
  const P=o.P!=null?o.P:sc.P;L.push(`<line x1="${X(0)}" y1="${Y(P)}" x2="${X(1)}" y2="${Y(P)}" class="ds"/>`);
  if(o.tie){const [x,y]=o.tie;L.push(`<line x1="${X(y)}" y1="${Y(P)}" x2="${X(x)}" y2="${Y(P)}" class="tie"/>`);}
  (o.pts||[]).forEach(p=>L.push(`<circle cx="${X(p.x)}" cy="${Y(P)}" r="6" class="pt ${p.c||''}"/><text x="${X(p.x)+(p.dx||0)}" y="${Y(P)-10}" class="pl${p.c==='ok'?' ok':''}" text-anchor="middle">${p.l}</text>`));
  L.push(`<circle cx="${X(sc.z)}" cy="${Y(P)}" r="5" class="pth-s"/><text x="${X(sc.z)}" y="${Y(P)+20}" class="pthl" text-anchor="middle">H</text>`);
  L.push('</svg>');return L.join('');}
function vleAns(sc,P){const p=P!=null?P:sc.P;const x=(p-sc.PA)/(sc.PB-sc.PA),y=sc.PB*x/p;return {x,y,fl:(sc.z-y)/(x-y)};}
D6.vle={badge:'Đường nối pha – đòn bẩy',
 init(pt,P){P.res.pl={};P.res.cur='L';P.res.v={fl:''};},
 body(pt,P,done){const sc=cur.scope;const A=vleAns(sc);const bad=P.res.bad||{};
  let h='';if(!done)h+=`<div class="seg small-seg" role="radiogroup" aria-label="Điểm đang đặt">${[['L','Pha lỏng (L)'],['V','Pha hơi (V)']].map(([k,t])=>`<button type="button" role="radio" aria-checked="${P.res.cur===k}" data-vc="${k}">Đặt ${t}${P.res.pl[k]!=null?' ✓':''}</button>`).join('')}</div>`;
  const pts=done?[{x:A.x,l:'L',c:'ok'},{x:A.y,l:'V',c:'ok'}]:Object.entries(P.res.pl).map(([l,x])=>({x,l,c:'u'}));
  h+=`<div class="dgw ${done?'':'clickv'}">${vleSVG(sc,{lab:done,pts,tie:done?[A.x,A.y]:null})}</div>`;

  h+=`<div class="tw"><table class="dgt"><tbody><tr class="${!done&&bad.fl?'bad':''}"><th>Phần số mol của hệ nằm ở pha lỏng, <i>n</i><sub>L</sub>/<i>n</i> (%)</th><td>${done?`<b>${fmt(A.fl*100,3)} %</b> = (<i>z</i> − <i>x</i><sup>h</sup>)/(<i>x</i><sup>l</sup> − <i>x</i><sup>h</sup>) = (${fmt(sc.z,3)} − ${fmt(A.y,3)})/(${fmt(A.x,3)} − ${fmt(A.y,3)})`:`<input inputmode="decimal" data-vf value="${esc(P.res.v.fl)}" aria-label="Phần trăm số mol pha lỏng">`}</td></tr></tbody></table></div>`;
  h+=qzHtml(pt,P,done);
  if(done)h+=`<div class="sim" data-vsim><p class="lbl">Mô phỏng: giảm áp suất đẳng nhiệt</p><div class="sim-g2"><div class="sim-d"></div><div class="sim-c"></div></div><div class="sim-ctl"><button class="btn small primary" type="button" data-sp>▶ Chạy</button><input type="range" min="0" max="1000" value="${(()=>{const Pb=sc.PA+(sc.PB-sc.PA)*sc.z,Pd=pDew(sc,sc.z);return Math.round((Pb+0.06*(Pb-Pd)-sc.P)/((Pb-Pd)*1.12)*1000);})()}" data-sr aria-label="Áp suất"><span class="sim-pc small muted"></span></div><p class="sim-st" aria-live="polite"></p></div>`;
  return h;},
 check(pt,P,errs){const sc=cur.scope;const A=vleAns(sc);if(P.res.pl.L==null||P.res.pl.V==null)return 'Hãy đặt cả điểm pha lỏng L và điểm pha hơi V.';
  const fl=parseNum(P.res.v.fl);if(!isFinite(fl))return 'Hãy nhập phần trăm số mol pha lỏng.';if(pt.qz&&P.res.qz.some(x=>x==null))return 'Hãy trả lời đủ các câu hỏi.';
  const xl=P.res.pl.L,xv=P.res.pl.V;const okL=Math.abs(xl-A.x)<=0.03,okV=Math.abs(xv-A.y)<=0.03;
  if(!okL||!okV){if(Math.abs(xl-A.y)<=0.03&&Math.abs(xv-A.x)<=0.03)errs.push(['Hai điểm L và V bị đặt đảo.','liq-vap','Pha lỏng nằm trên đường lỏng (đường thẳng phía trên), pha hơi nằm trên đường hơi (đường cong phía dưới).']);
   else{if(!okL)errs.push(['Điểm L chưa nằm tại giao của đường nằm ngang qua H với đường lỏng.','tie-read','Đường lỏng là đường thẳng nối P°A và P°B (định luật Raoult).']);if(!okV)errs.push(['Điểm V chưa nằm tại giao của đường nằm ngang qua H với đường hơi.','tie-read','Đường hơi là đường cong phía dưới.']);}}
  const wx=okL?xl:A.x,wy=okV?xv:A.y;const e1=(sc.z-wy)/(wx-wy)*100;
  if(Math.abs(fl-A.fl*100)>3&&Math.abs(fl-e1)>3){P.res.bad.fl=1;const sw=(wx-sc.z)/(wx-wy)*100;
   if(Math.abs(fl-sw)<=3)errs.push(['Bạn đã tính phần pha hơi thay cho pha lỏng (đòn bẩy bị đảo).','lever-swap','<i>n</i><sub>L</sub>/<i>n</i> = HV/LV = (<i>z</i> − <i>x</i><sup>h</sup>)/(<i>x</i><sup>l</sup> − <i>x</i><sup>h</sup>): pha lỏng ứng với đoạn từ H đến V.']);
   else errs.push(['Phần số mol pha lỏng chưa đúng.','lever-swap','Quy tắc đòn bẩy: <i>n</i><sub>L</sub>/<i>n</i> = (<i>z</i> − <i>x</i><sup>h</sup>)/(<i>x</i><sup>l</sup> − <i>x</i><sup>h</sup>), với <i>z</i> là thành phần của điểm hệ H.']);}
  qzCheck(pt,P,errs);return true;},
 bind(el,i,pt,P,done){el.querySelectorAll('[data-vc]').forEach(b=>b.addEventListener('click',()=>{P.res.cur=b.dataset.vc;renderDiag(i);}));
  const inp=el.querySelector('[data-vf]');if(inp)inp.addEventListener('input',()=>{P.res.v.fl=inp.value;});
  const svg=el.querySelector('.clickv svg');if(svg)svg.addEventListener('click',e=>{const q=svgPt(svg,e);const G=vleGeo(cur.scope);const x=G.iX(q.x);if(x<-0.02||x>1.02)return;
    P.res.pl[P.res.cur]=Math.max(0,Math.min(1,x));if(P.res.cur==='L'&&P.res.pl.V==null)P.res.cur='V';renderDiag(i);});
  const box=el.querySelector('[data-vsim]');if(box)vleSim(box);}};
function vleSim(box){const sc=cur.scope;const Pb=sc.PA+(sc.PB-sc.PA)*sc.z,Pd=pDew(sc,sc.z);const r=box.querySelector('[data-sr]'),b=box.querySelector('[data-sp]');let raf=0,t0=0,u0=0;
  const draw=()=>{const u=r.value/1000;const P=Pb+0.06*(Pb-Pd)-(Pb-Pd)*1.12*u;let st,fl,x=null,y=null;
    if(P>=Pb){fl=1;st=`<b>Một pha lỏng</b> (P = ${fmt(P,4)} mmHg > áp suất sôi ${fmt(Pb,4)} mmHg). Bậc tự do (<i>T</i> cố định): <i>c</i> = 2 − 1 + 1 = 2.`;}
    else if(P<=Pd){fl=0;st=`<b>Một pha hơi</b> (P = ${fmt(P,4)} mmHg < áp suất ngưng ${fmt(Pd,4)} mmHg). <i>c</i> = 2 − 1 + 1 = 2.`;}
    else{const A=vleAns(sc,P);x=A.x;y=A.y;fl=A.fl;st=`<b>Hai pha: lỏng (<i>x</i><sup>l</sup><sub>B</sub> = ${fmt(x,3)}) + hơi (<i>x</i><sup>h</sup><sub>B</sub> = ${fmt(y,3)})</b>; pha lỏng chiếm ${fmt(fl*100,3)} % số mol. <i>c</i> = 2 − 2 + 1 = 1: chọn P thì thành phần hai pha xác định.`;}
    box.querySelector('.sim-d').innerHTML=vleSVG(sc,{lab:true,P,tie:x!=null?[x,y]:null,pts:x!=null?[{x,l:'L',c:'ok'},{x:y,l:'V',c:'ok'}]:[]});
    box.querySelector('.sim-c').innerHTML=lvSVG(fl,x,y,sc);box.querySelector('.sim-st').innerHTML=st;box.querySelector('.sim-pc').textContent=`P = ${fmt(P,4).replace(/<[^>]+>/g,'')} mmHg`;};
  const stop=()=>{cancelAnimationFrame(raf);raf=0;b.textContent='▶ Chạy';};
  const step=ts=>{if(!box.isConnected){cancelAnimationFrame(raf);return;}if(!t0)t0=ts;const u=u0+(ts-t0)/10000;if(u>=1){r.value=1000;draw();stop();return;}r.value=Math.round(u*1000);draw();raf=requestAnimationFrame(step);};
  b.addEventListener('click',()=>{if(raf){stop();return;}if(+r.value>=1000)r.value=0;u0=r.value/1000;t0=0;b.textContent='❚❚ Dừng';raf=requestAnimationFrame(step);});
  r.addEventListener('input',()=>{if(raf)stop();draw();});draw();}
function lvSVG(fl,x,y,sc){const L=[`<svg class="dg cyl" viewBox="0 0 170 272" role="img" aria-label="Xi lanh: lượng pha lỏng và pha hơi">`];
  const x0=34,x1=136,yb=214,W=x1-x0;const lh=fl*40,gh=(1-fl)*140;L.push(`<rect x="${x0-4}" y="22" width="${W+8}" height="${yb-18}" rx="4" class="cyl-w"/>`);
  if(lh>0)L.push(`<rect x="${x0}" y="${yb-lh}" width="${W}" height="${lh}" fill="#8EC3E6"/>`);
  const n=Math.round(24*(1-fl));for(let i=0;i<n;i++)L.push(`<circle cx="${(x0+5+rnd1(i+3)*(W-10)).toFixed(1)}" cy="${(yb-lh-gh+4+rnd1(i+60)*Math.max(1,gh-8)).toFixed(1)}" r="2.4" fill="#8A9BAD"/>`);
  const py=yb-lh-gh;L.push(`<rect x="${x0-1}" y="${py-9}" width="${W+2}" height="9" rx="2" class="cyl-pi"/><line x1="85" y1="${py-9}" x2="85" y2="6" class="cyl-rod"/>`);
  L.push(`<text x="85" y="${yb+20}" class="tk" text-anchor="middle">lỏng ${fmt(fl*100,3)} %</text><text x="85" y="${yb+36}" class="tk" text-anchor="middle">hơi ${fmt((1-fl)*100,3)} %</text></svg>`);return L.join('');}

/* --- 3. Giản đồ T–x có hoặc không có điểm đẳng phí: sản phẩm chưng cất phân đoạn --- */
const AZS=[
 {A:'iso-propanol',B:'acetone',Ta:82.4,Tb:56.2,az:null,ty:'Lý tưởng (không có điểm đẳng phí)'},
 {A:'C₂H₅OH',B:'CCl₄',Ta:77.9,Tb:75.9,az:[0.63,63.5],ty:'Đẳng phí cực tiểu (sai lệch dương)'},
 {A:'H₂O',B:'HNO₃',Ta:100,Tb:83,az:[0.38,120.5],ty:'Đẳng phí cực đại (sai lệch âm)'}];
const AZT=['Lý tưởng (không có điểm đẳng phí)','Đẳng phí cực tiểu (sai lệch dương)','Đẳng phí cực đại (sai lệch âm)'];
function azIdeal(S,x,vap){const ta=S.Ta+273.15,tb=S.Tb+273.15;const p=(Tb,T)=>Math.exp(88*Tb/8.314*(1/Tb-1/T));
  const f=T=>vap?((1-x)/p(ta,T)+x/p(tb,T))-1:((1-x)*p(ta,T)+x*p(tb,T))-1;let lo=Math.min(ta,tb)-1,hi=Math.max(ta,tb)+1;
  for(let k=0;k<60;k++){const m=(lo+hi)/2;if((f(m)>0)===(vap?false:true))hi=m;else lo=m;}return (lo+hi)/2-273.15;}
function azT(S,x,vap){if(!S.az)return azIdeal(S,x,vap);
  const [xa,Taz]=S.az;const left=x<=xa;const u=left?(xa-x)/xa:(x-xa)/(1-xa);const Te=left?S.Ta:S.Tb;const mx=Taz>Math.max(S.Ta,S.Tb);
  const g1=u*u,g2=2*u*u-u*u*u*u;const g=mx?(vap?g1:g2):(vap?g2:g1);return Taz+(Te-Taz)*g;}
function azProd(S,z){const pa=S.A+' nguyên chất',pb=S.B+' nguyên chất',az='Hỗn hợp đẳng phí';
  if(!S.az)return S.Ta<S.Tb?[pa,pb]:[pb,pa];const side=z<S.az[0]?pa:pb;return S.az[1]<Math.min(S.Ta,S.Tb)?[az,side]:[side,az];}
function azSVG(S,z,done){const Ts=[S.Ta,S.Tb].concat(S.az?[S.az[1]]:[]);const lo=Math.min(...Ts)-6,hi=Math.max(...Ts)+6;const X=x=>50+x*340,Y=T=>292-(T-lo)/(hi-lo)*262;
  const L=[`<svg class="dg az" viewBox="0 0 420 330" role="img" aria-label="Giản đồ T–x của hệ ${S.A} – ${S.B}">`];
  L.push(`<line x1="${X(0)}" y1="${Y(lo)}" x2="${X(1)}" y2="${Y(lo)}" class="frame"/><line x1="${X(0)}" y1="${Y(lo)}" x2="${X(0)}" y2="16" class="frame"/><line x1="${X(1)}" y1="${Y(lo)}" x2="${X(1)}" y2="16" class="frame"/>`);
  for(let k=0;k<=10;k+=2)L.push(`<text x="${X(k/10)}" y="${Y(lo)+15}" class="tk" text-anchor="middle">${fmt(k/10,2)}</text>`);
  L.push(`<text x="${X(0)}" y="${Y(lo)+30}" class="ax" text-anchor="middle">${S.A}</text><text x="${X(1)}" y="${Y(lo)+30}" class="ax" text-anchor="middle">${S.B}</text><text x="${X(0.5)}" y="${Y(lo)+30}" class="tk" text-anchor="middle">x (${S.B}) →</text><text x="${X(0)+6}" y="14" class="ax"><tspan font-style="italic">T</tspan> (°C)</text>`);
  {const st=hi-lo>40?20:hi-lo>20?10:5;for(let v=Math.ceil(lo/st)*st;v<=hi;v+=st)L.push(`<line x1="${X(0)-4}" y1="${Y(v)}" x2="${X(0)}" y2="${Y(v)}" class="frame"/><line x1="${X(1)}" y1="${Y(v)}" x2="${X(1)+4}" y2="${Y(v)}" class="frame"/>`);}
  [[S.Ta,0,'end',-5],[S.Tb,1,'start',5]].forEach(([T,x,an,dx])=>L.push(`<text x="${X(x)+dx}" y="${Y(T)+4}" class="tk" text-anchor="${an}">${fmt(T,4)}</text>`));
  ['l','v'].forEach(k=>{let d='';for(let i=0;i<=120;i++){const x=i/120;d+=(i?' L':'M')+X(x).toFixed(1)+','+Y(azT(S,x,k==='v')).toFixed(1);}L.push(`<path d="${d}" class="cv${k==='v'?' cvd':''}"/>`);});
  if(S.az&&done){L.push(`<line x1="${X(S.az[0])}" y1="${Y(S.az[1])}" x2="${X(S.az[0])}" y2="${Y(lo)}" class="ds"/><circle cx="${X(S.az[0])}" cy="${Y(S.az[1])}" r="5" class="lmp"/><text x="${X(S.az[0])+8}" y="${Y(S.az[1])+(S.az[1]>S.Ta?-8:16)}" class="lm"><tspan class="lmb">Đẳng phí</tspan> (${fmt(S.az[0],2)}; ${fmt(S.az[1],4)} °C)</text>`);}
  if(done){L.push(`<text x="${X(0.5)}" y="28" class="rg" text-anchor="middle">Hơi</text><text x="${X(0.5)}" y="${Y(lo)-8}" class="rg" text-anchor="middle">Lỏng</text>`);}
  const Tz=azT(S,z,false);L.push(`<line x1="${X(z)}" y1="${Y(lo)}" x2="${X(z)}" y2="${Y(Tz)}" class="ds"/><circle cx="${X(z)}" cy="${Y(Tz)}" r="6" class="pt q"/><text x="${X(z)+8}" y="${Y(Tz)+(Tz<(lo+hi)/2?-8:16)}" class="pthl">H (x = ${fmt(z,2)})</text>`);
  L.push('</svg>');return L.join('');}
D6.azeo={badge:'Giản đồ T–x – chưng cất',

  const prods=[S.A+' nguyên chất',S.B+' nguyên chất','Hỗn hợp đẳng phí'];

   <tr class="${!done&&bad.top?'bad':''}"><th>Sản phẩm đỉnh (chưng cất phân đoạn H)</th><td>${done?`<b>${tp}</b>`:opt6('data-az="top"',P.res.s.top,prods,'Sản phẩm đỉnh')}</td></tr>

  return h+qzHtml(pt,P,done);},
 check(pt,P,errs){const sc=cur.scope;const S=AZS[sc.sys];const [tp,bt]=azProd(S,sc.z);const s=P.res.s;

  if(s.ty!==S.ty){P.res.bad.ty=1;errs.push(['Loại hệ chưa đúng.','raoult-dev','Có điểm cực trị chung của hai đường là có đẳng phí; cực tiểu nhiệt độ ứng với sai lệch dương, cực đại ứng với sai lệch âm.']);}
  if(s.top!==tp){P.res.bad.top=1;errs.push(['Sản phẩm đỉnh chưa đúng.','azeo-prod','Sản phẩm đỉnh là thành phần có nhiệt độ sôi thấp nhất mà hệ đi tới được từ H, không vượt qua điểm đẳng phí.']);}
  if(s.bot!==bt){P.res.bad.bot=1;errs.push(['Sản phẩm đáy chưa đúng.','azeo-prod','Sản phẩm đáy là thành phần có nhiệt độ sôi cao nhất ở cùng phía với H so với điểm đẳng phí.']);}
  qzCheck(pt,P,errs);return true;},
 bind(el,i,pt,P){el.querySelectorAll('select[data-az]').forEach(x=>x.addEventListener('change',()=>{P.res.s[x.dataset.az]=x.value;}));}};

/* --- 4. Chưng cất phân đoạn: dựng bậc thang trên giản đồ x–y (hồi lưu hoàn toàn) --- */
const yEq=(a,x)=>a*x/(1+(a-1)*x);
function stNeed(sc){return Math.ceil(Math.log((sc.xt/(1-sc.xt))*((1-sc.x0)/sc.x0))/Math.log(sc.al)-1e-9);}
function stPath(sc,n){const p=[[sc.x0,sc.x0]];let x=sc.x0;for(let k=0;k<n;k++){const y=yEq(sc.al,x);p.push([x,y],[y,y]);x=y;}return p;}
function stSVG(sc,pts,o){const X=x=>50+x*300,Y=y=>330-y*300;const L=[`<svg class="dg st" viewBox="0 0 400 372" role="img" aria-label="Giản đồ x–y và các bậc cân bằng">`];
  for(let k=0;k<=10;k++){L.push(`<line x1="${X(k/10)}" y1="${Y(0)}" x2="${X(k/10)}" y2="${Y(1)}" class="${k%5?'g2':'g'}"/><line x1="${X(0)}" y1="${Y(k/10)}" x2="${X(1)}" y2="${Y(k/10)}" class="${k%5?'g2':'g'}"/>`);
    if(k%2===0)L.push(`<text x="${X(k/10)}" y="${Y(0)+15}" class="tk" text-anchor="middle">${fmt(k/10,2)}</text><text x="${X(0)-5}" y="${Y(k/10)+4}" class="tk" text-anchor="end">${fmt(k/10,2)}</text>`);}
  L.push(`<rect x="${X(0)}" y="${Y(1)}" width="300" height="300" class="frame2"/><text x="${X(1)}" y="${Y(0)+32}" class="ax" text-anchor="end">xˡ (pha lỏng) →</text><text x="${X(0)}" y="${Y(1)-8}" class="ax">xʰ (pha hơi)</text>`);
  L.push(`<line x1="${X(0)}" y1="${Y(0)}" x2="${X(1)}" y2="${Y(1)}" class="dvd"/>`);
  let d='';for(let i=0;i<=80;i++){const x=i/80;d+=(i?' L':'M')+X(x).toFixed(1)+','+Y(yEq(sc.al,x)).toFixed(1);}L.push(`<path d="${d}" class="cv"/>`);
  L.push(`<line x1="${X(sc.xt)}" y1="${Y(0)}" x2="${X(sc.xt)}" y2="${Y(1)}" class="ds"/><text x="${X(sc.xt)-4}" y="${Y(0.04)}" class="lm" text-anchor="end">xˡ<tspan font-size="8">D</tspan> = ${fmt(sc.xt,2)}</text>`);
  L.push(`<line x1="${X(sc.x0)}" y1="${Y(0)}" x2="${X(sc.x0)}" y2="${Y(sc.x0)}" class="ds"/><text x="${X(sc.x0)+4}" y="${Y(0.04)}" class="lm">xˡ<tspan font-size="8">0</tspan> = ${fmt(sc.x0,2)}</text>`);
  if(pts.length>1){let s='M'+X(pts[0][0])+','+Y(pts[0][1]);for(let k=1;k<pts.length;k++)s+=' L'+X(pts[k][0]).toFixed(1)+','+Y(pts[k][1]).toFixed(1);L.push(`<path d="${s}" class="stp"/>`);}
  for(let k=2;k<pts.length;k+=2)L.push(`<text x="${X(pts[k-1][0])-6}" y="${Y(pts[k-1][1])-6}" class="pl${o.done?' ok':''}" text-anchor="end">${k/2}</text>`);
  L.push(`<circle cx="${X(sc.x0)}" cy="${Y(sc.x0)}" r="5" class="pth-s"/>`);
  if(o.next)L.push(`<circle cx="${X(o.next[0])}" cy="${Y(o.next[1])}" r="9" class="nxt"/>`);
  L.push('</svg>');return L.join('');}
D6.stairs={badge:'Bậc thang chưng cất',
 init(pt,P){P.res.n=0;P.res.half=false;P.res.miss=0;P.res.N='';P.res.msg='';},
 body(pt,P,done){const sc=cur.scope;const N=stNeed(sc);let h='';
  if(done){h+=`<div class="dgw">${stSVG(sc,stPath(sc,N),{done:true})}</div><p class="small muted">Cần <b>${N}</b> bậc cân bằng (kể cả nồi đun). Phương trình Fenske cho số bậc tối thiểu liên tục: <i>N</i> = ln{[<i>x</i><sup>l</sup><sub>D</sub>/(1 − <i>x</i><sup>l</sup><sub>D</sub>)]·[(1 − <i>x</i><sup>l</sup><sub>0</sub>)/<i>x</i><sup>l</sup><sub>0</sub>]}/ln<i>α</i> = ${fmt(Math.log((sc.xt/(1-sc.xt))*((1-sc.x0)/sc.x0))/Math.log(sc.al),3)}, làm tròn lên ${N}.</p>`;}
  else{const pts=stPath(sc,P.res.n);let x=sc.x0;for(let k=0;k<P.res.n;k++)x=yEq(sc.al,x);if(P.res.half)pts.push([x,yEq(sc.al,x)]);
   const reached=!P.res.half&&x>=sc.xt;
   h+=`<div class="dgw ${reached?'':'clicks'}">${stSVG(sc,pts,{})}</div>`;
   h+=`<p class="small muted">${reached?`Đã đạt <i>x</i><sup>l</sup> ≥ <i>x</i><sup>l</sup><sub>D</sub> sau ${P.res.n} bậc.`:P.res.half?'Bấm lên <b>đường chéo</b> <i>x</i><sup>h</sup> = <i>x</i><sup>l</sup>, đi ngang từ điểm vừa đặt (hơi ngưng tụ thành lỏng ở đĩa trên).':'Bấm lên <b>đường cân bằng</b>, đi thẳng đứng từ điểm hiện tại (lỏng sôi, sinh hơi cân bằng).'} ${P.res.msg?`<span class="stmsg">${P.res.msg}</span>`:''}</p>`;
   h+=`<div class="row"><button class="btn small ghost" type="button" data-st="undo" ${P.res.n||P.res.half?'':'disabled'}>Xóa bước cuối</button></div>`;
   h+=`<div class="tw"><table class="dgt"><tbody><tr class="${P.res.bad&&P.res.bad.N?'bad':''}"><th>Số bậc cân bằng (đĩa lý thuyết, kể cả nồi đun)</th><td><input inputmode="numeric" data-sn value="${esc(P.res.N)}" aria-label="Số bậc cân bằng"></td></tr></tbody></table></div>`;}
  return h+qzHtml(pt,P,done);},
 check(pt,P,errs){const sc=cur.scope;const N=stNeed(sc);let x=sc.x0;for(let k=0;k<P.res.n;k++)x=yEq(sc.al,x);
  if(P.res.half||x<sc.xt)return 'Hãy dựng đủ các bậc cho tới khi thành phần đạt hoặc vượt <i>x</i><sup>l</sup><sub>D</sub>.';
  const n=parseNum(P.res.N);if(!isFinite(n))return 'Hãy nhập số bậc cân bằng.';if(pt.qz&&P.res.qz.some(v=>v==null))return 'Hãy trả lời đủ các câu hỏi.';
  if(n!==N){P.res.bad.N=1;errs.push([`Số bậc chưa đúng: bạn đã dựng ${N} bậc trên giản đồ.`,'diag-read','Đếm số bậc thang (mỗi bậc gồm một đoạn thẳng đứng và một đoạn nằm ngang); bậc đầu tiên là nồi đun.']);}
  qzCheck(pt,P,errs);return true;},
 bind(el,i,pt,P){const sc=cur.scope;const svg=el.querySelector('.clicks svg');
  if(svg)svg.addEventListener('click',e=>{const q=svgPt(svg,e);const x=(q.x-50)/300,y=(330-q.y)/300;let xc=sc.x0;for(let k=0;k<P.res.n;k++)xc=yEq(sc.al,xc);const ye=yEq(sc.al,xc);
    if(!P.res.half){if(Math.abs(x-xc)<=0.035&&Math.abs(y-ye)<=0.035){P.res.half=true;P.res.msg='';}else{P.res.miss++;P.res.msg=Math.abs(x-xc)>0.035?'Chưa đúng: đoạn đi lên phải thẳng đứng (giữ nguyên x của pha lỏng).':'Chưa đúng: điểm phải nằm trên đường cân bằng xʰ = f(xˡ).';hit('stage-step');}}
    else{if(Math.abs(x-ye)<=0.035&&Math.abs(y-ye)<=0.035){P.res.half=false;P.res.n++;P.res.msg='';}else{P.res.miss++;P.res.msg='Chưa đúng: đoạn nằm ngang dừng ở đường chéo, tại đó xˡ (lỏng đĩa trên) = xʰ (hơi đi lên).';hit('stage-step');}}
    renderDiag(i);});
  el.querySelectorAll('[data-st]').forEach(b=>b.addEventListener('click',()=>{if(P.res.half)P.res.half=false;else if(P.res.n){P.res.n--;P.res.half=true;}P.res.msg='';renderDiag(i);}));
  const inp=el.querySelector('[data-sn]');if(inp)inp.addEventListener('input',()=>{P.res.N=inp.value;});}};

/* ===== Chương 7: giản đồ kết tinh Al–Si (không tạo dung dịch rắn, không tạo hợp chất) ===== */
const EUT={A:'Al',B:'Si',Ta:660,Tb:1414,xe:12.6,Te:577,k:1.81};
function eLiq(x){const E=EUT;if(x<=E.xe)return E.Ta+(E.Te-E.Ta)*x/E.xe;const u=(x-E.xe)/(100-E.xe);return E.Te+(E.Tb-E.Te)*(1-Math.pow(1-u,E.k));}
function eXl(T,side){const E=EUT;if(side==='A')return E.xe*(E.Ta-T)/(E.Ta-E.Te);const r=(T-E.Te)/(E.Tb-E.Te);return E.xe+(100-E.xe)*(1-Math.pow(1-r,1/E.k));}
const eX=x=>50+x*3.4,eY=T=>300-(T-400)/1100*280,eiX=px=>(px-50)/3.4,eiY=py=>400+(300-py)/280*1100;
function eutSVG(o){const E=EUT;const L=[`<svg class="dg eut" viewBox="0 0 426 340" role="img" aria-label="Giản đồ kết tinh hệ Al–Si">`];
  for(let x=0;x<=100;x+=10)L.push(`<line x1="${eX(x)}" y1="${eY(400)}" x2="${eX(x)}" y2="${eY(1500)}" class="${x%50?'g2':'g'}"/>`);
  for(let T=400;T<=1500;T+=100){L.push(`<line x1="${eX(0)}" y1="${eY(T)}" x2="${eX(100)}" y2="${eY(T)}" class="g2"/>`);if(T%200===0)L.push(`<text x="${eX(0)-5}" y="${eY(T)+4}" class="tk" text-anchor="end">${T}</text><text x="${eX(100)+5}" y="${eY(T)+4}" class="tk">${T}</text>`);}
  L.push(`<line x1="${eX(0)}" y1="${eY(400)}" x2="${eX(0)}" y2="${eY(1500)}" class="frame"/><line x1="${eX(100)}" y1="${eY(400)}" x2="${eX(100)}" y2="${eY(1500)}" class="frame"/><line x1="${eX(0)}" y1="${eY(400)}" x2="${eX(100)}" y2="${eY(400)}" class="frame"/>`);
  for(let x=0;x<=100;x+=20)L.push(`<text x="${eX(x)}" y="${eY(400)+15}" class="tk" text-anchor="middle">${x}</text>`);
  L.push(`<rect x="${eX(0)}" y="${eY(1500)}" width="340" height="280" class="frame2"/><text x="${eX(0)}" y="${eY(400)+30}" class="ax" text-anchor="middle">Al</text><text x="${eX(100)}" y="${eY(400)+30}" class="ax" text-anchor="middle">Si</text><text x="${eX(50)}" y="${eY(400)+30}" class="tk" text-anchor="middle">% khối lượng Si →</text><text x="${eX(0)+4}" y="${eY(1500)-6}" class="ax"><tspan font-style="italic">T</tspan> (°C)</text>`);
  let d='';for(let i=0;i<=100;i++){const x=i;d+=(i?' L':'M')+eX(x).toFixed(1)+','+eY(eLiq(x)).toFixed(1);}
  L.push(`<path d="M${eX(0)},${eY(E.Ta)} L${eX(E.xe)},${eY(E.Te)}" class="cv"/><path d="${(()=>{let s='';for(let i=0;i<=60;i++){const x=E.xe+(100-E.xe)*i/60;s+=(i?' L':'M')+eX(x).toFixed(1)+','+eY(eLiq(x)).toFixed(1);}return s;})()}" class="cv"/><line x1="${eX(0)}" y1="${eY(E.Te)}" x2="${eX(100)}" y2="${eY(E.Te)}" class="cv"/>`);
  L.push(`<circle cx="${eX(E.xe)}" cy="${eY(E.Te)}" r="4" class="lmp"/>`);
  if(o.lab){L.push(`<text x="${eX(E.xe)+6}" y="${eY(E.Te)+16}" class="lm"><tspan class="lmb">E</tspan> (${fmt(E.xe,3)} %; ${E.Te} °C)</text><text x="${eX(0)+5}" y="${eY(E.Ta)-6}" class="lm">${E.Ta} °C</text><text x="${eX(100)-5}" y="${eY(E.Tb)-6}" class="lm" text-anchor="end">${E.Tb} °C</text>`);
   L.push(`<text x="${eX(30)}" y="${eY(1380)}" class="rg">I: Lỏng</text><text x="${eX(5.5)}" y="${eY(612)}" class="rg" font-size="9">II</text><text x="${eX(62)}" y="${eY(850)}" class="rg">III: L + rắn Si</text><text x="${eX(50)}" y="${eY(480)}" class="rg" text-anchor="middle">IV: Rắn Al + rắn Si</text>`);}
  if(o.vline!=null)L.push(`<line x1="${eX(o.vline)}" y1="${eY(400)}" x2="${eX(o.vline)}" y2="${eY(1500)}" class="ds"/>`);

/* --- 2. Đường nguội (làm lạnh hệ có thành phần z) --- */
const COOLOPT=['Lỏng nguội đi (đi xuống dốc)','Kết tinh Al, nhiệt độ vẫn giảm (dốc thoải hơn)','Kết tinh Si, nhiệt độ vẫn giảm (dốc thoải hơn)','Kết tinh eutecti Al + Si (nằm ngang)','Rắn Al + rắn Si nguội đi (đi xuống dốc)'];
const FIRST=['Al','Si','Al và Si cùng lúc (eutecti)'];
function coolTruth(z){const E=EUT;return Math.abs(z-E.xe)<0.05?[0,3,4]:z<E.xe?[0,1,3,4]:[0,2,3,4];}
function coolModel(z){const E=EUT;const Tl=eLiq(z),T0=Math.min(1500,Tl+150);const tr=coolTruth(z);const segs=[];
  const Le=1-(z<E.xe?(E.xe-z)/E.xe:(z-E.xe)/(100-E.xe));tr.forEach(t=>{if(t===0)segs.push({t,T0,T1:Tl,w:(T0-Tl)/150});else if(t===1||t===2)segs.push({t,T0:Tl,T1:E.Te,w:(Tl-E.Te)/60});else if(t===3)segs.push({t,T0:E.Te,T1:E.Te,w:0.6+3*Le});else segs.push({t,T0:E.Te,T1:450,w:(E.Te-450)/150});});
  let c=0;segs.forEach(s=>{s.q0=c;c+=s.w;s.q1=c;});return {segs,tot:c,z,Tl,T0};}
function coolState(M,u){const E=EUT;const q=u*M.tot;const s=M.segs.find(x=>q<=x.q1+1e-9)||M.segs[M.segs.length-1];const f=s.w?(q-s.q0)/s.w:1;const T=s.T0+(s.T1-s.T0)*f;const z=M.z;
  let L=1,sA=0,sB=0,eu=0,xl=z;if(s.t===1){xl=eXl(T,'A');sA=(xl-z)/xl;L=1-sA;}else if(s.t===2){xl=eXl(T,'B');sB=(z-xl)/(100-xl);L=1-sB;}
  else if(s.t>=3){const prA=z<E.xe?(E.xe-z)/E.xe:0,prB=z>E.xe?(z-E.xe)/(100-E.xe):0;const Le=1-prA-prB;const g=s.t===3?f:1;L=Le*(1-g);eu=Le*g;sA=prA;sB=prB;xl=E.xe;}
  return {s,T,L,sA,sB,eu,xl,q};}
function coolSVG(M,o){const E=EUT;const hi=Math.max(M.T0,o.T0||0)+30,lo=420;const xm=o.xm||M.tot;const X=x=>50+x/xm*350,Y=T=>292-(T-lo)/(hi-lo)*270;
  const L=[`<svg class="dg hc" viewBox="0 0 420 320" role="img" aria-label="Đường nguội: nhiệt độ theo thời gian">`];
  L.push(`<line x1="50" y1="300" x2="404" y2="300" class="frame"/><line x1="50" y1="300" x2="50" y2="10" class="frame"/><text x="404" y="316" class="ax" text-anchor="end">Thời gian →</text><text x="56" y="18" class="ax"><tspan font-style="italic">T</tspan> (°C)</text>`);
  [E.Te].concat(o.ticks||[]).forEach(T=>L.push(`<line x1="46" y1="${Y(T)}" x2="404" y2="${Y(T)}" class="g2"/><text x="44" y="${Y(T)+4}" class="tk" text-anchor="end">${fmt(T,4)}</text>`));
  const p=o.pts;for(let j=1;j<p.length;j++)L.push(`<line x1="${X(p[j-1][0])}" y1="${Y(p[j-1][1])}" x2="${X(p[j][0])}" y2="${Y(p[j][1])}" class="${p[j][2]==='f'?'hcf':'hcu'}${p[j][3]?' hcd':''}"/>`);
  if(o.cur)L.push(`<line x1="${X(o.cur[0])}" y1="300" x2="${X(o.cur[0])}" y2="10" class="ds"/><circle cx="${X(o.cur[0])}" cy="${Y(o.cur[1])}" r="7" class="mv"/>`);
  L.push('</svg>');return L.join('');}
function coolPtsTrue(M){const p=[[0,M.T0]];M.segs.forEach(s=>p.push([s.q1,s.T1,s.t===3?'f':'u']));return p;}
function coolPtsUser(cs,z,Tin){const E=EUT;const Tl=isFinite(Tin)?Tin:eLiq(z);let T=Math.min(1500,eLiq(z)+150);const p=[[0,T]];let x=0;
  cs.forEach((c,j)=>{const t=COOLOPT.indexOf(c.v);const nx=cs[j+1]?COOLOPT.indexOf(cs[j+1].v):-1;let T1,w=1,k='u',dash=t<0;
    if(t<0){T1=T-60;}else if(t===0){T1=nx===1||nx===2?Tl:nx===3?E.Te:T-120;w=Math.max(0.3,(T-T1)/150);}else if(t===1||t===2){T1=E.Te;w=Math.max(0.3,(T-E.Te)/60);}else if(t===3){T1=T;w=1.6;k='f';}else{T1=450;w=Math.max(0.3,(T-450)/150);}
    x+=w;p.push([x,T1,k,dash]);T=T1;});return {p,xm:Math.max(4,x)};}
function beakerSVG(st){const W=100,x0=35,yb=200,H=150;const L=[`<svg class="dg cyl" viewBox="0 0 170 250" role="img" aria-label="Chén nung: pha lỏng và tinh thể">`];
  L.push(`<path d="M${x0-4},${yb-H-10} L${x0-4},${yb+4} L${x0+W+4},${yb+4} L${x0+W+4},${yb-H-10}" class="cyl-w" fill="none"/>`);
  let y=yb;const seg=(h,cls,fill)=>{if(h<=0.3)return;L.push(`<rect x="${x0}" y="${y-h}" width="${W}" height="${h}" ${fill?`fill="${fill}"`:`class="${cls}"`}/>`);y-=h;};
  const tot=H*0.75;seg(st.sA*tot,'','#C9CED6');seg(st.sB*tot,'','#5B6472');seg(st.eu*tot,'','url(#eup)');seg(st.L*tot,'','#E8823A');
  L.splice(1,0,`<defs><pattern id="eup" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#C9CED6"/><rect width="4" height="4" fill="#5B6472"/><rect x="4" y="4" width="4" height="4" fill="#5B6472"/></pattern></defs>`);
  const lab=[['Rắn Al',st.sA,'#C9CED6'],['Rắn Si',st.sB,'#5B6472'],['Eutecti (Al + Si)',st.eu,'#8F96A1'],['Lỏng',st.L,'#E8823A']].filter(a=>a[1]>0.005);
  lab.forEach((a,k)=>L.push(`<text x="85" y="${216+k*11}" class="tk" text-anchor="middle">${a[0]}: ${fmt(a[1]*100,3)} %</text>`));
  L.push('</svg>');return L.join('');}
D6.cool={badge:'Đường nguội',

  return h+qzHtml(pt,P,done);},
 check(pt,P,errs){const sc=cur.scope;const z=sc.z;const tr=coolTruth(z);const cs=P.res.cs;
  if(!cs.length||cs.some(c=>!c.v))return 'Hãy ghép đủ các đoạn của đường nguội.';const Tl=parseNum(P.res.Tl);if(!isFinite(Tl)||!P.res.fs)return 'Hãy nhập nhiệt độ bắt đầu kết tinh và chọn chất rắn tách ra đầu tiên.';

  qzCheck(pt,P,errs);return true;},

 check(pt,P,errs){const sc=cur.scope;const xl=eXl(sc.T,'B');const gs=sc.M*(sc.z-xl)/(100-xl);if(P.res.xl==null)return 'Hãy đặt điểm pha lỏng L trên giản đồ.';const g=parseNum(P.res.g);if(!isFinite(g))return 'Hãy nhập khối lượng rắn Si.';

  const xu=Math.abs(P.res.xl-xl)<=2.5?P.res.xl:xl;const g2=sc.M*(sc.z-xu)/(100-xu);

   errs.push(Math.abs(g-sw)<=0.04*sw?['Bạn đã tính khối lượng pha lỏng thay cho rắn Si (đòn bẩy bị đảo).','lever-swap','<i>g</i><sub>rắn</sub>/<i>g</i> = HL/RL = (<i>z</i> − <i>x</i><sub>L</sub>)/(100 − <i>x</i><sub>L</sub>).']:['Khối lượng rắn Si chưa đúng.','lever-swap','Đòn bẩy: <i>g</i><sub>rắn Si</sub> = <i>g</i>·(<i>z</i> − <i>x</i><sub>L</sub>)/(100 − <i>x</i><sub>L</sub>), thành phần theo % khối lượng.']);}

function initDiag(pt,P){if(pt.kind==='pt'){const pool=[...PT_POOL];const tp=pool.pop();const pick=shuffle(pool.length).slice(0,4).map(k=>pool[k]);pick.splice(Math.floor(Math.random()*5),0,tp);P.res.pts=pick;P.res.sel=pick.map(()=>({ph:'',c:''}));}
  if(pt.kind==='ptr')ptrInit(pt,P);

  P.dg=true;}
const PHASES=['rắn','lỏng','hơi','rắn + lỏng','rắn + hơi','lỏng + hơi','rắn + lỏng + hơi'];

function triTargets(pt){return pt.tg.map(p=>({l:p.l,a:ev(String(p.a),cur.scope),b:ev(String(p.b),cur.scope)}));}

  if(pt.kind==='tri-place'){const tg=triTargets(pt);const placed=Object.entries(P.res.place).map(([l,v])=>({l,a:v[0],b:v[1],cls:'u'}));

     <tr><th>Khối lượng lớp L₁ (g)</th><td>${done?`<b>${fmt(cur.exact.txm1,4)}</b>`:`<input inputmode="decimal" data-f="m1" value="${esc(v.m1)}" aria-label="Khối lượng L1">`}</td></tr>
     <tr><th>Khối lượng lớp L₂ (g)</th><td>${done?`<b>${fmt(sc.m-cur.exact.txm1,4)}</b>`:`<input inputmode="decimal" data-f="m2" value="${esc(v.m2)}" aria-label="Khối lượng L2">`}</td></tr></tbody></table>`;}
  const actions=done?'':`<div class="row"><button class="btn primary" type="button" data-dact="check">Kiểm tra</button>${P.res.tries>=1?'<button class="btn ghost" type="button" data-dact="show">Xem đáp án</button>':''}</div>`;

  el.querySelectorAll('select[data-k],input[data-k]').forEach(x=>x.addEventListener('input',()=>{const k=+x.dataset.k,f=x.dataset.f;if(pt.kind==='pt'||pt.kind==='ptr')P.res.sel[k][f]=x.value;else P.res.vals[k][f]=x.value;}));

  if(svg)svg.addEventListener('click',e=>{const pnt=svg.createSVGPoint();pnt.x=e.clientX;pnt.y=e.clientY;const q=pnt.matrixTransform(svg.getScreenCTM().inverse());
    const t=xyTri(q.x,q.y);if(t.some(v=>v<-3))return;const r=t.map(v=>Math.max(0,Math.min(100,v)));P.res.place[P.res.curT]=r;
    const tg=triTargets(pt);const nx=tg.find(x=>!P.res.place[x.l]);if(nx)P.res.curT=nx.l;renderDiag(i);});
  el.querySelectorAll('[data-dact]').forEach(b=>b.addEventListener('click',()=>diagAct(i,b.dataset.dact)));
  if(pt.kind==='path'||pt.kind==='hc')bindD2(el,i,pt,P,done);
  if(D6[pt.kind]&&D6[pt.kind].bind)D6[pt.kind].bind(el,i,pt,P,done);

function permMatch(v,t,tol){const ps=[[0,1,2],[0,2,1],[1,0,2],[1,2,0],[2,0,1],[2,1,0]];return ps.slice(1).some(p=>p.every((k,j)=>Math.abs(v[j]-t[k])<=tol));}
function diagAct(i,act){const pt=cur.p.parts[i];const P=cur.parts[i];const sc=cur.scope;
  if(act==='show'){P.res.st='shown';P.fb.res='';renderDiag(i);afterPart(i);return;}
  let errs=[];P.res.bad={};
  if(pt.kind==='path'||pt.kind==='hc'||D6[pt.kind]){const r=(pt.kind==='path'?pathCheck:pt.kind==='hc'?hcCheck:D6[pt.kind].check)(pt,P,errs);if(r!==true){P.fb.res=`<div class="fb neutral"><p>${r}</p></div>`;renderDiag(i);return;}}
  if(pt.kind==='ptr'&&!ptrCheck(pt,P,errs)){P.fb.res='<div class="fb neutral"><p>Hãy chọn đủ pha, bậc tự do cho mọi điểm và trả lời đủ các câu hỏi.</p></div>';renderDiag(i);return;}
  if(pt.kind==='pt'){if(P.res.sel.some(s=>s.ph===''||s.c==='')){P.fb.res='<div class="fb neutral"><p>Hãy chọn đủ pha và bậc tự do cho mọi điểm.</p></div>';renderDiag(i);return;}
    P.res.pts.forEach((p,k)=>{const s=P.res.sel[k];const okPh=s.ph===p.ph,okC=+s.c===p.c;if(!okPh||!okC){P.res.bad[k]=1;
      if(!okPh)errs.push([`Điểm ${k+1}: các pha chưa đúng.`,p.t?'phase-count':'phase-count',p.t==='tp'?'Điểm ba là giao của ba đường: ba pha cùng tồn tại.':p.t?'Điểm nằm trên đường cân bằng giữa hai vùng: hai pha cùng tồn tại.':'Điểm nằm trong một vùng: chỉ một pha.']);
      else errs.push([`Điểm ${k+1}: bậc tự do chưa đúng.`,'phase-rule',`<i>c</i> = 1 − ${p.ph.split('+').length} + 2 = ${p.c}.`]);}});}
  if(pt.kind==='tri-read'){const pts=triPts(pt);
    for(const [k,p] of pts.entries()){const v=P.res.vals[k];const nv=['a','b','c'].map(f=>parseNum(v[f]));
      if(nv.some(x=>!isFinite(x))){P.fb.res='<div class="fb neutral"><p>Hãy nhập đủ ba giá trị cho mọi điểm.</p></div>';renderDiag(i);return;}
      const t=[p.a,p.b,100-p.a-p.b];const ok=nv.every((x,j)=>Math.abs(x-t[j])<=2);
      if(!ok){P.res.bad[k]=1;const s=nv[0]+nv[1]+nv[2];
        if(Math.abs(s-100)>2)errs.push([`Điểm ${p.l}: tổng ba thành phần bằng ${fmt(s,3)} %, phải bằng 100 %.`,'tri-axis','Ít nhất một giá trị đọc sai trục.']);
        else if(permMatch(nv,t,2))errs.push([`Điểm ${p.l}: các giá trị đúng nhưng gán nhầm cấu tử.`,'tri-axis','%A đọc trên cạnh CA (bên phải), %B trên cạnh AB (bên trái), %C trên cạnh BC (đáy).']);
        else errs.push([`Điểm ${p.l}: chưa đúng.`,'tri-axis','Từ điểm, đi song song với cạnh đối diện đỉnh của cấu tử để gặp thang chia của cấu tử đó.']);}}}
  if(pt.kind==='tri-place'){const tg=triTargets(pt);
    if(tg.some(t=>!P.res.place[t.l])){P.fb.res='<div class="fb neutral"><p>Hãy đặt đủ các điểm.</p></div>';renderDiag(i);return;}
    tg.forEach(t=>{const v=P.res.place[t.l];const tt=[t.a,t.b,100-t.a-t.b];const ok=v.every((x,j)=>Math.abs(x-tt[j])<=2.5);
      if(!ok){if(permMatch(v,tt,3))errs.push([`Điểm ${t.l} đặt ở vị trí ứng với các giá trị của cấu tử khác.`,'tri-axis','Kiểm tra lại cạnh mang thang %A, %B, %C.']);
        else errs.push([`Điểm ${t.l} chưa đúng vị trí (bạn đặt tại ${f1(v[0])}; ${f1(v[1])}; ${f1(v[2])}).`,'tri-axis','Xác định giao của hai đường: %A = const và %B = const.']);}});}
  if(pt.kind==='tx'){const v=P.res.v;const n={};for(const f of ['w1','w2','m1','m2']){n[f]=parseNum(v[f]);if(!isFinite(n[f])){P.fb.res='<div class="fb neutral"><p>Hãy nhập đủ bốn giá trị.</p></div>';renderDiag(i);return;}}
    const T=sc.T,w0=sc.w0,m=sc.m,a=wL(T),b=wR(T);
    const r1=Math.abs(n.w1-a)<=1.5,r2=Math.abs(n.w2-b)<=1.5;
    if(!r1||!r2){if(Math.abs(n.w1-b)<=1.5&&Math.abs(n.w2-a)<=1.5)errs.push(['Hai lớp bị đọc đảo: L₁ là lớp giàu A (bên trái), L₂ là lớp giàu B.','tie-read','']);
      else{if(!r1)errs.push([`% B của L₁ chưa đúng${Math.abs(n.w1-w0)<1?' — đó là thành phần của điểm hệ H':''}.`,'tie-read','Đọc giao điểm bên trái của đường nằm ngang ở '+T+' °C với đường cong.']);
        if(!r2)errs.push([`% B của L₂ chưa đúng${Math.abs(n.w2-w0)<1?' — đó là thành phần của điểm hệ H':''}.`,'tie-read','Đọc giao điểm bên phải của đường nằm ngang với đường cong.']);}}
    const ww1=r1?n.w1:a,ww2=r2?n.w2:b;const e1=m*(ww2-w0)/(ww2-ww1),e1x=m*(b-w0)/(b-a);
    const ok1=Math.abs(n.m1-e1)<=0.02*m||Math.abs(n.m1-e1x)<=0.02*m;const ok2=Math.abs(n.m2-(m-e1))<=0.02*m||Math.abs(n.m2-(m-e1x))<=0.02*m;
    if(!ok1||!ok2){const sw=m*(w0-ww1)/(ww2-ww1);if(Math.abs(n.m1-sw)<=0.02*m)errs.push(['Khối lượng hai lớp bị đảo.','lever-swap','<i>m</i>(L₁) = <i>m</i>·(<i>w</i>₂ − <i>w</i>₀)/(<i>w</i>₂ − <i>w</i>₁): lớp L₁ ứng với đoạn từ H đến L₂.']);
      else if(Math.abs(n.m1+n.m2-m)>0.02*m)errs.push(['Tổng khối lượng hai lớp phải bằng '+fmt(m)+' g.','lever-swap','']);
      else errs.push(['Khối lượng hai lớp chưa đúng.','lever-swap','<i>m</i>(L₁) = <i>m</i>·(<i>w</i>₂ − <i>w</i>₀)/(<i>w</i>₂ − <i>w</i>₁), dùng chính thành phần bạn đọc được.']);}}
  if(!errs.length){P.res.st='ok';P.fb.res='';renderDiag(i);okFx(i);afterPart(i);return;}
  P.res.tries++;errs.forEach(e=>hit(e[1]));
  P.fb.res=`<div class="fb bad remark"><p class="fb-h">${errs.length} chỗ chưa đúng.</p><ul class="slot-fb">${errs.map(e=>`<li>${e[0]}${e[2]?' '+e[2]:''}${PITFALLS[e[1]]?` <span class="tag">${PITFALLS[e[1]].t}</span>`:''}</li>`).join('')}</ul></div>`;
  renderDiag(i);}

/* ===== Định dạng ===== */
function parts_(x,sig){if(!isFinite(x))return null;if(x===0)return {m:'0',e:0};const a=Math.abs(x);
  if(a>=1e-3&&a<1e7){let s=String(Number(x.toPrecision(sig)));if(/e/.test(s))s=Number(s).toFixed(8).replace(/0+$/,'');return {m:s,e:0};}
  const e=Math.floor(Math.log10(a));let m=Number((x/10**e).toPrecision(sig));if(Math.abs(m)>=10){m/=10;return {m:String(Number(m.toPrecision(sig))),e:e+1};}return {m:String(m),e};}

function stepBox(n,title,state,body){return `<li class="fs fs-${state}"><div class="fs-h"><span class="fs-n">${n}</span><span>${title}</span>${state==='ok'?'<span class="badge b-ok">Đúng</span>':state==='shown'?'<span class="badge b-shown">Đã xem đáp án</span>':''}</div>${state==='locked'?'':`<div class="fs-b">${body}</div>`}</li>`;}

function renderPart(i){const el=$('#part-'+i);const pt=cur.p.parts[i];const P=cur.parts[i];const open=partOpen(i);
  if(pt.kind&&open){renderDiag(i);return;}
  const head=`<header class="part-h"><span class="pkey">${cur.p.parts.length>1?pt.key+')':''}</span><div><h2>${pt.label}</h2><p class="ask">${fill(pt.ask,cur.scope)}</p></div></header>`;
  if(!open){el.className='part is-locked';el.innerHTML=head+'<p class="muted small">Hoàn thành ý trước để mở ý này.</p>';return;}
  el.className='part'+(partDone(i)?' is-done':'');
  const step=stepOf(i);let html=head;
  if(cur.mode==='exam'){html+=resultBlock(i,true);if(partDone(i))html+=modelSolution(i);el.innerHTML=html;bindPart(i);typeset(el);return;}
  const st=(k,cond)=>cond?(k.st==='skip'?'skip':(k.st==='open'?'open':k.st)):'locked';
  let items='';
  if(pt.an)items+=stepBox(1,FRAME[0].t,st(P.an,step>=1),mcq('an'+i,pt.an,P.an,P.an.st!=='open')+fbHtml(P.fb.an)+(P.an.st!=='open'?`<p class="why">${fill(pt.an.why,cur.scope)}</p>`:actions('an',P.an.tries)));
  if(pt.fo)items+=stepBox(2,FRAME[1].t,st(P.fo,step>=2),mcq('fo'+i,pt.fo,P.fo,P.fo.st!=='open')+fbHtml(P.fb.fo)+(P.fo.st!=='open'?`<p class="why">${fill(pt.fo.why,cur.scope)}</p>`:actions('fo',P.fo.tries)));
  items+=stepBox(3,FRAME[2].t,step>=3?(P.sub.st==='open'?'open':P.sub.st):'locked',
    (P.sub.st==='open'?`<p class="small muted">Chọn số liệu đúng cho từng ô — đơn vị được đổi ngay khi thế số.</p>${substHtml(pt,null,true,i)}${fbHtml(P.fb.sub)}${actions('sub',P.sub.tries,'Kiểm tra biểu thức')}`:substHtml(pt,null,false,i)));
  items+=stepBox(4,FRAME[3].t,step>=4?(partDone(i)?(P.res.st==='shown'?'shown':'ok'):'open'):'locked',resultBlock(i,false));
  html+=`<ol class="flow">${items}</ol>`;
  if(partDone(i))html+=modelSolution(i);
  el.innerHTML=html;bindPart(i);typeset(el);}

function fbHtml(f){return f?`<div class="fbw" aria-live="polite">${f}</div>`:'';}
function actions(kind,tries,label){return `<div class="row"><button class="btn primary" type="button" data-act="${kind}">${label||'Xác nhận'}</button>${tries>=1?`<button class="btn ghost" type="button" data-show="${kind}">Xem đáp án bước này</button>`:''}</div>`;}
function resultBlock(i,exam){const pt=cur.p.parts[i];const P=cur.parts[i];let h='';
  if(P.res.st==='open'){h+=`${exam?'':'<p class="small muted">Biểu thức đã đúng. Bấm máy một lần và ghi kết quả kèm đơn vị.</p>'}<div class="ans"><label class="sr" for="in-${i}">Kết quả</label><input id="in-${i}" inputmode="decimal" autocomplete="off" spellcheck="false" placeholder="Kết quả" value="${esc(P.res.val)}"><select id="un-${i}" aria-label="Đơn vị"><option value="">đơn vị…</option>${pt.units.map(u=>`<option ${P.res.unit===u?'selected':''}>${u}</option>`).join('')}</select></div>${fbHtml(P.fb.res)}<div class="row"><button class="btn primary" type="button" data-act="res">Kiểm tra kết quả</button>${P.res.tries>=1?'<button class="btn ghost" type="button" data-show="res">Xem kết quả</button>':''}</div>`;}
  else{h+=`<p class="res">${fill(pt.lhs,cur.scope)} = ${P.res.st==='shown'?fmt(cur.exact[pt.sym]):fmt(P.res.uv)} ${P.res.st==='shown'?pt.unit:P.res.unit}</p>${fbHtml(P.fb.res)}`;
    if(pt.chk){const C=P.chk;const done=C.st!=='open';const a=ev(pt.chk.ans,cur.scope);
      h+=`<div class="chk"><p class="ask">Nhận xét: ${fill(pt.chk.q,cur.scope)}</p><div class="opts">${pt.chk.o.map((o,k)=>`<label class="opt ${done&&k===a?'right':''} ${done&&C.pick===k&&k!==a?'wrong':''}"><input type="radio" name="ck${i}" value="${k}" ${C.pick===k?'checked':''} ${done?'disabled':''}><span>${fill(o,cur.scope)}</span></label>`).join('')}</div>${fbHtml(P.fb.chk)}${done?'':`<div class="row"><button class="btn primary" type="button" data-act="chk">Xác nhận</button></div>`}</div>`;}}
  return h;}

function bindPart(i){const el=$('#part-'+i);const P=cur.parts[i];
  el.querySelectorAll('input[type=radio]').forEach(r=>r.addEventListener('change',()=>{const n=r.name;const k=+r.value;if(n.startsWith('an'))P.an.pick=k;else if(n.startsWith('fo'))P.fo.pick=k;else if(n.startsWith('ck'))P.chk.pick=k;}));
  el.querySelectorAll('select.slot').forEach(s=>s.addEventListener('change',()=>{P.sub.picks[s.dataset.slot]=s.value===''?undefined:+s.value;delete P.sub.bad[s.dataset.slot];s.className='slot';}));
  const inp=el.querySelector('#in-'+i);if(inp){inp.addEventListener('input',()=>P.res.val=inp.value);inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();act(i,'res');}});}
  const un=el.querySelector('#un-'+i);if(un)un.addEventListener('change',()=>P.res.unit=un.value);
  el.querySelectorAll('[data-act]').forEach(b=>b.addEventListener('click',()=>act(i,b.dataset.act)));
  el.querySelectorAll('[data-show]').forEach(b=>b.addEventListener('click',()=>show(i,b.dataset.show)));}



function act(i,kind){const pt=cur.p.parts[i];const P=cur.parts[i];
  if(kind==='an'||kind==='fo'){const Q=pt[kind],S=P[kind];if(S.pick==null){P.fb[kind]='<div class="fb neutral"><p>Hãy chọn một phương án.</p></div>';renderPart(i);return;}
    if(S.pick===Q.a){S.st='ok';P.fb[kind]='';okFx(i);}else{S.tries++;P.fb[kind]=`<div class="fb bad"><p class="fb-h">Chưa đúng.</p><p>${kind==='an'?'Đọc lại đề, gạch chân từ khóa về quá trình và điều kiện thực hiện.':'Đối chiếu với kết quả phân tích ở bước 1 và bảng công thức bên cạnh.'}</p></div>`;}
    renderPart(i);focusFirst(i);return;}
  if(kind==='sub'){const sl=slotsOf(pt).filter(S=>S.o.length>1);const miss=sl.filter(S=>P.sub.picks[S.s]==null);
    if(miss.length){P.fb.sub='<div class="fb neutral"><p>Hãy chọn đủ số liệu cho mọi ô.</p></div>';renderPart(i);return;}
    const wrong=sl.filter(S=>P.sub.picks[S.s]!==0);sl.forEach(S=>P.sub.bad[S.s]=P.sub.picks[S.s]!==0);
    if(!wrong.length){P.sub.st='ok';P.fb.sub='';renderPart(i);okFx(i);focusFirst(i);return;}
    P.sub.tries++;wrong.forEach(S=>hit(S.o[P.sub.picks[S.s]][2]));
    P.fb.sub=`<div class="fb bad remark"><p class="fb-h">${wrong.length} ô số liệu chưa đúng.</p><ul class="slot-fb">${wrong.map(S=>{const o=S.o[P.sub.picks[S.s]];const pf=PITFALLS[o[2]];return `<li><b>${fill(o[0],cur.scope)}</b> — ${fill(o[3]||'',cur.scope)}${pf?` <span class="tag">${pf.t}</span>`:''}</li>`}).join('')}</ul></div>`;
    renderPart(i);return;}
  if(kind==='res'){const v=parseNum(P.res.val);const u=P.res.unit;
    if(!isFinite(v)){P.fb.res='<div class="fb neutral"><p>Chưa đọc được số. Nhập dạng −284,35 hoặc 1,64e3 (dấu phẩy thập phân được chấp nhận).</p></div>';renderPart(i);return;}
    if(!u){P.fb.res='<div class="fb neutral"><p>Kết quả bắt buộc kèm đơn vị — hãy chọn đơn vị.</p></div>';renderPart(i);return;}
    const e=cur.exact[pt.sym];const tol=pt.tol||0.01;
    if(!unitOk(u,pt)){P.res.tries++;hit('unit-mix');P.fb.res=`<div class="fb bad"><p class="fb-h">Đơn vị chưa phù hợp với đại lượng cần tìm.</p><p>${fill(pt.lhs,cur.scope)} có đơn vị dạng “${pt.unit}”. Kiểm tra lại thứ nguyên của biểu thức.</p></div>`;renderPart(i);return;}
    const vb=toBase(v,u),eb=toBase(e,pt.unit);
    if(close(vb,eb,tol)){P.res.st='ok';P.res.uv=v;okFx(i);P.fb.res=u!==pt.unit&&UF[u][1]!==UF[pt.unit][1]?`<div class="fb ok"><p>Đúng (đã đổi sang ${u}).</p></div>`:'';renderPart(i);
      if(!pt.chk)afterPart(i);else focusFirst(i);return;}
    P.res.tries++;
    const r=evalSub(pt,cur.scope,null);const eu=valueIn(eb,u);
    const traps=(cur.mode==='exam'?slotTraps(pt,cur.scope):[]).map(t=>({...t,v:valueIn(toBase(t.v,pt.unit),u)}))
      .concat((pt.calc||[]).map(c=>({v:valueIn(toBase(ev(c.e,r.s),pt.unit),u),pit:c.p||'calc',msg:c.m})));
    const d=diagnose(v,eu,traps,tol);
    if(d.pit)hit(cur.mode==='guided'&&d.kind==='ratio'?d.pit:d.pit);
    if(d.kind==='trap')P.fb.res=pitNote(d.pit,fill(d.msg,cur.scope));
    else if(d.kind==='ratio'||d.kind==='near')P.fb.res=pitNote(d.pit,d.msg+(cur.mode==='guided'?' Biểu thức của bạn đã đúng, nên lỗi nằm ở khâu bấm máy hoặc đổi đơn vị kết quả.':''));
    else{let mag='';const q=v/eu;if(isFinite(q)&&q<0)mag=' Kết quả ngược dấu với đáp án.';else if(isFinite(q)&&(q>3||q<1/3))mag=` Kết quả ${q>1?'lớn':'nhỏ'} hơn đáp án khoảng ${fmt(q>1?q:1/q,2)} lần.`;
      P.fb.res=cur.mode==='guided'?pitNote('calc','Biểu thức đã đúng nhưng kết quả chưa khớp.'+mag):`<div class="fb bad"><p class="fb-h">Chưa khớp.${mag}</p><p>Kiểm tra lại công thức, số liệu và đơn vị khi thế số. Có thể chuyển sang chế độ “Luyện theo 4 bước” để tìm chỗ sai.</p></div>`;}
    renderPart(i);$('#in-'+i)&&$('#in-'+i).focus();return;}
  if(kind==='chk'){const C=P.chk;if(C.pick==null){P.fb.chk='<div class="fb neutral"><p>Hãy chọn một nhận xét.</p></div>';renderPart(i);return;}
    const a=ev(pt.chk.ans,cur.scope);if(C.pick===a){C.st='ok';P.fb.chk='';okFx(i);}else{C.tries++;C.st='shown';P.fb.chk='<div class="fb shown"><p>Nhận xét đúng được đánh dấu ở trên.</p></div>';}
    renderPart(i);afterPart(i);}}

function show(i,kind){const pt=cur.p.parts[i];const P=cur.parts[i];
  if(kind==='an'||kind==='fo'){P[kind].st='shown';P[kind].pick=pt[kind].a;P.fb[kind]='';renderPart(i);focusFirst(i);return;}
  if(kind==='sub'){P.sub.st='shown';P.fb.sub='';renderPart(i);focusFirst(i);return;}
  if(kind==='res'){P.res.st='shown';P.fb.res='';renderPart(i);if(!pt.chk)afterPart(i);}}
function focusFirst(i){setTimeout(()=>{const el=$('#part-'+i);const t=el&&el.querySelector('.fs-open input,.fs-open select,#in-'+i);if(t)t.focus();},30);}
function afterPart(i){const n=cur.p.parts.length;if(i+1<n){renderPart(i+1);focusFirst(i+1);}else finish();}

function scorePart(P){const mc=S=>S.st==='skip'?null:S.st==='ok'?Math.max(0,1-0.5*S.tries):0;
  if(cur.mode==='exam'||P.dg)return {got:P.res.st==='ok'?Math.max(0.25,1-0.25*P.res.tries):0,max:1};
  const a=[mc(P.an),mc(P.fo),P.sub.st==='ok'?Math.max(0.25,1-0.25*P.sub.tries):0,P.res.st==='ok'?Math.max(0.25,1-0.25*P.res.tries):0].filter(x=>x!==null);
  return {got:a.reduce((x,y)=>x+y,0),max:a.length};}
function finish(){cur.finished=true;let g=0,m=0;cur.parts.forEach(P=>{const s=scorePart(P);g+=s.got;m+=s.max;});cur.pct=Math.round(g/m*100);
  asgRecord();const pr=store.prog[cur.p.id]||{n:0};pr.n++;const k=cur.mode==='exam'?'e':'g';pr[k]=Math.max(pr[k]||0,cur.pct);store.prog[cur.p.id]=pr;save();
  renderSummary();updateTop();setTimeout(()=>celebrate(cur.pct),350);
  $('#summary').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'});}
function renderSummary(){const el=$('#summary');if(!cur.finished){el.innerHTML='';return;}
  const p=cur.p;const idx=PROBLEMS.indexOf(p);const an=asgNext();const ns=nextSame(p);const nx=an?byId[an]:ns.p;const hits=Object.entries(cur.hit);const pr=store.prog[p.id];
  el.innerHTML=`<section class="summary"><p class="lbl">Kết quả — ${cur.mode==='exam'?'Tự giải':'Luyện theo 4 bước'}</p>
   <div class="sum-top"><p class="score"><b>${cur.pct}</b><span>%</span></p><div><p class="sum-msg">${cur.pct>=80?(cur.mode==='exam'?'Bạn đã tự giải được dạng bài này.':'Bạn đã nắm các bước giải. Hãy thử chế độ Tự giải.'):cur.pct>=50?'Đi đúng hướng; làm lại với bộ số mới và cố gắng đúng ngay lần đầu.':'Xem lại lời giải mẫu từng ý rồi làm lại với bộ số mới.'}</p><p class="muted small">Cao nhất: 4 bước ${pr.g??'–'} %; Tự giải ${pr.e??'–'} %.</p></div></div>
   ${hits.length?`<div class="sum-hits"><h3>Lỗi đã gặp trong lần làm này</h3><ul>${hits.map(([k,v])=>`<li><b>${PITFALLS[k].t}</b>${v>1?` (${v} lần)`:''} — ${PITFALLS[k].fix}</li>`).join('')}</ul></div>`:''}
   ${p.wrap||p.wfig?`<div class="sum-wrap"><h3>Nhận xét</h3>${p.wrap?`<p>${fill(p.wrap,cur.scope)}</p>`:''}${p.wfig?`<figure class="pfig">${p.wfig(cur.scope)}</figure>`:''}</div>`:''}
   ${cur.sh?'<div id="sh-st" class="sh-st"></div>':''}
   <div class="row">${cur.asg&&asgActive()&&asgActive().kt?'':'<button class="btn primary" type="button" id="again">Làm lại với số liệu mới</button>'}${cur.mode==='guided'&&!p.self?'<button class="btn" type="button" id="toexam">Thử chế độ Tự giải</button>':''}${cur.asg&&!an?`<a class="btn" href="#giao-${cur.asg}">Về danh sách bài giao (lấy mã nộp)</a>`:`<a class="btn" href="#bai-${nx.id}">${cur.asg?'Bài giao tiếp theo':ns.same?'Bài tiếp theo cùng dạng':'Bài tiếp theo'}</a>`}</div></section>`;
  const ag=$('#again');if(ag)ag.addEventListener('click',()=>{newAttempt(p.id,cur.mode,false);renderSolve();scrollTo(0,0);});shShow();
  const te=$('#toexam');if(te)te.addEventListener('click',()=>{window._mode='exam';newAttempt(p.id,'exam',false);renderSolve();scrollTo(0,0);});
  typeset(el);}

const FLAME={1:{el:'Na',c:'#F2A900'},2:{el:'Ca',c:'#F06A28'},3:{el:'Sr',c:'#E8304F'},4:{el:'Ba',c:'#4FB83C'},5:{el:'Cu',c:'#0FA3B1'},6:{el:'K',c:'#9B6BE8'},7:{el:'Cs',c:'#3E64E8'}};
const chStyle=n=>`--ch:${FLAME[n].c}`;
const norm=t=>String(t).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[đĐ]/g,'d').toLowerCase().replace(/<[^>]+>/g,'');
function grpOf(p){return p.diag?'dg':p.self?'tg':'lt';}
const GRP={lt:{t:'Luyện theo 4 bước',d:'Bài mẫu từ slide hướng dẫn và sách: làm từng bước, sai bước nào được chỉ ra bước đó.'},dg:{t:'Đọc và phân tích giản đồ',d:'Xác định pha, bậc tự do, đọc thành phần; vẽ đường đi của quá trình, dựng đường đun nóng và xem mô phỏng.'},tg:{t:'Tự giải (Sách BT)',d:'Dạng bài khác, chỉ nhập đáp số như khi thi; ứng dụng vẫn đoán chỗ sai.'}};
function shortSrc(p){const s=p.src;const sl=/HDBT\s+(C[\d.]+)[^–]*–\s*Bài tập\s*(\d+)/.exec(s);const cs=s.match(/[MP]\d+\.\d+/g)||[];

  const seq=[];for(const x of ms){if(x.c===String.fromCharCode(97+seq.length))seq.push(x);}if(seq.length<2)return h;
  let out=h.slice(0,seq[0].i).trim();if(out&&!/[.:;?!>]$/.test(out))out+=':';seq.forEach((x,k)=>{const end=k+1<seq.length?seq[k+1].i:h.length;const t=h.slice(x.j,end).trim().replace(/[,;]?\s+(và|hoặc)$/,'').replace(/,$/,'');out+=br?`<br><b>${x.c})</b> ${t}`:`<span class="pt-sub"><b class="pt-sm">${x.c})</b><span>${t}</span></span>`;});return out;}

let _drFrom=null;
function openDrawer(tab,from){const d=$('#drawer');if(!d)return;if(from)_drFrom=from;d.hidden=false;requestAnimationFrame(()=>d.classList.add('on'));

  view().querySelectorAll('[data-dr]').forEach(b=>b.classList.toggle('on',b.dataset.dr===tab));typeset(d);d.querySelector(`[data-tab="${tab}"]`).focus();}
function closeDrawer(){const d=$('#drawer');if(!d||d.hidden)return;d.classList.remove('on');view().querySelectorAll('[data-dr]').forEach(b=>b.classList.remove('on'));setTimeout(()=>{d.hidden=true;},200);if(_drFrom)_drFrom.focus();}

const RM=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
let _fx=null;
function fxCanvas(){if(_fx)return _fx;const c=document.createElement('canvas');c.className='fx';c.setAttribute('aria-hidden','true');document.body.appendChild(c);
  _fx={c,ctx:c.getContext('2d'),ps:[],run:false};const rs=()=>{const r=devicePixelRatio||1;c.width=innerWidth*r;c.height=innerHeight*r;_fx.ctx.setTransform(r,0,0,r,0,0);};rs();addEventListener('resize',rs);return _fx;}
function hexPath(ctx,r){ctx.beginPath();for(let k=0;k<6;k++){const a=Math.PI/3*k+Math.PI/6;ctx.lineTo(r*Math.cos(a),r*Math.sin(a));}ctx.closePath();}
function burst(x,y,n,spread,cols){if(RM())return;const F=fxCanvas();
  for(let k=0;k<n;k++){const a=-Math.PI/2+(Math.random()-.5)*spread,v=3+Math.random()*6*(n>60?1.4:1);
    F.ps.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,r:3+Math.random()*5,rot:Math.random()*6,vr:(Math.random()-.5)*.3,c:cols[k%cols.length],s:k%3,life:0,max:55+Math.random()*40});}
  if(!F.run){F.run=true;requestAnimationFrame(fxTick);}}
function fxTick(){const F=_fx;const ctx=F.ctx;ctx.clearRect(0,0,innerWidth,innerHeight);
  F.ps=F.ps.filter(p=>p.life<p.max);for(const p of F.ps){p.life++;p.vy+=0.18;p.vx*=0.99;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;const al=Math.max(0,1-p.life/p.max);
    ctx.save();ctx.globalAlpha=al;ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.c;ctx.strokeStyle=p.c;ctx.lineWidth=2;
    if(p.s===0){ctx.beginPath();ctx.arc(0,0,p.r*.8,0,7);ctx.fill();}else if(p.s===1){hexPath(ctx,p.r*1.3);ctx.stroke();ctx.beginPath();ctx.arc(0,0,p.r*.6,0,7);ctx.stroke();}else{ctx.fillRect(-p.r,-p.r*.35,p.r*2,p.r*.7);}
    ctx.restore();}
  if(F.ps.length)requestAnimationFrame(fxTick);else{F.run=false;ctx.clearRect(0,0,innerWidth,innerHeight);}}
function curCols(){const c=FLAME[cur?cur.p.ch:1].c;return [c,'#F2A900','#0FA3B1','#E8304F','#4FB83C','#9B6BE8',c];}
function spark(i){const el=$('#part-'+i);if(!el)return;const t=[...el.querySelectorAll('.fs-ok')].pop()||el.querySelector('.res')||el.querySelector('.b-ok')||el;
  const b=t.querySelector('.b-ok')||(el.querySelector('.b-ok'));if(b){b.classList.remove('just');void b.offsetWidth;b.classList.add('just');}
  const r=t.getBoundingClientRect();if(r.bottom<0||r.top>innerHeight)return;burst(Math.min(r.left+90,r.right-20),r.top+16,22,1.6,curCols());}
function okFx(i){setTimeout(()=>spark(i),90);}
function celebrate(pct){if(pct<80){store.streak=0;save();return;}store.streak=(store.streak||0)+1;save();
  const st=document.createElement('div');st.className='stamp';st.setAttribute('role','status');
  st.innerHTML=`<b>${pct>=100?'Xuất sắc!':'Đạt!'}</b><span>${pct} %${store.streak>1?` · ${store.streak} bài liên tiếp`:''}</span>`;st.style.setProperty('--ch',FLAME[cur.p.ch].c);
  document.body.appendChild(st);setTimeout(()=>st.classList.add('out'),1500);setTimeout(()=>st.remove(),2000);
  burst(innerWidth*.2,innerHeight*.85,70,1.2,curCols());setTimeout(()=>burst(innerWidth*.8,innerHeight*.85,70,1.2,curCols()),180);
  setTimeout(()=>burst(innerWidth*.5,innerHeight*.6,50,2.6,curCols()),360);}

function nextSame(p){const ps=railOrder(p.ch);const k=ps.indexOf(p);const g=grpOf(p);
  const same=ps.slice(k+1).concat(ps.slice(0,k)).find(x=>grpOf(x)===g&&status(x.id)!=='done');if(same)return {p:same,same:true};
  const idx=PROBLEMS.indexOf(p);return {p:ps[k+1]||PROBLEMS[(idx+1)%PROBLEMS.length],same:false};}

/* ===== Lý thuyết nền: giao diện ===== */
function thShuf(arr){return shuffle(arr.length).map(i=>arr[i]);}
const THT={match:['🔗','Ghép cặp'],order:['↕️','Sắp thứ tự'],sort:['🗂️','Phân loại'],tf:['⚖️','Đúng / Sai']};
const ABC='ABCDEFGHIJ';
const PAIRC=['#1D5FA0','#E8304F','#2E8B3A','#E09B00','#9B6BE8','#0FA3B1','#F06A28','#5A6B7D'];
function thSt(id){const S=window._ths=window._ths||{};return S[id];}
function thInit(it,force){const S=window._ths=window._ths||{};if(S[it.id]&&!force)return S[it.id];
  const s={tries:0,checked:false,ok:false,shown:false,res:null};
  if(it.type==='match'){s.R=thShuf([...it.P.map((_,i)=>i),...it.X.map((_,i)=>it.P.length+i)]);s.pairs={};s.sel=0;}
  if(it.type==='order'){let o;do{o=thShuf(it.I.map((_,i)=>i));}while(o.every((v,i)=>v===i));s.ord=o;}
  if(it.type==='sort'){s.ord=thShuf(it.I.map((_,i)=>i));s.pick={};}
  if(it.type==='tf'){s.ord=it.S.map((_,i)=>i);s.pick={};s.fix={};s.fo=it.S.map(x=>thShuf(x[3].map((_,j)=>j)));}
  return S[it.id]=s;}
function thRight(it,j){return j<it.P.length?it.P[j][1]:it.X[j-it.P.length];}
function thDone(ch){const T=store.th||{};return (TH[ch]||[]).filter(it=>T[it.id]&&T[it.id].ok).length;}
function thBanner(ch){const N=(TH[ch]||[]).length;if(!N)return '';const d=thDone(ch);
  return `<section class="th-ban"><div><p class="th-step">Bước 1 · Trước khi giải bài</p><h2>Lý thuyết nền Chương ${ch}</h2><p class="small">${N} hoạt động ghép cặp, sắp thứ tự, phân loại và Đúng/Sai giúp bạn phân biệt các công thức, giản đồ và khái niệm cơ bản nhất của chương.</p>
   <div class="th-prog" aria-label="Đã đạt ${d}/${N}"><span style="width:${d/N*100}%"></span></div><p class="small"><b>${d}/${N}</b> hoạt động đã đạt</p></div>
   <a class="btn primary big" href="#ly-thuyet-${ch}">${d===0?'Bắt đầu':d<N?'Làm tiếp':'Ôn lại'}</a></section>`;}

function renderTheory(ch){const c=CHAPTERS.find(x=>x.n===ch);const its=TH[ch];its.forEach(it=>thInit(it));
  view().innerHTML=`<div class="lib th" style="${chStyle(ch)}"><header class="lib-h"><a class="back" href="#chuong-${ch}">Bài tập Chương ${ch}</a><p class="lib-n">Chương ${ch} · Lý thuyết nền</p><h1>${c.name}</h1>

function thProg(ch){const N=TH[ch].length,d=thDone(ch);const b=$('#th-prog span');if(b)b.style.width=d/N*100+'%';const t=$('#th-cnt');if(t)t.innerHTML=`Đã đạt <b>${d}/${N}</b> hoạt động`;
  const e=$('#th-end');if(e)e.innerHTML=d===N?`<p class="th-fin">Bạn đã nắm phần lý thuyết nền của chương. 🎉</p><a class="btn primary big" href="#chuong-${ch}">Sang bài tập Chương ${ch}</a>`:`<a class="btn ghost" href="#chuong-${ch}">Bỏ qua, sang bài tập</a>`;}
function mark(ok){return ok===undefined?'':`<span class="th-mk ${ok?'y':'n'}" aria-label="${ok?'Đúng':'Chưa đúng'}">${ok?'✓':'✗'}</span>`;}
function thPaint(ch,it){const s=thSt(it.id);const el=document.getElementById('th-'+it.id);if(!el)return;const [ic,tn]=THT[it.type];const R=s.res;const lock=s.ok||s.shown;
  const hint=k=>(s.ok||s.shown||s.tries>=2)&&R&&(!R[k]||s.ok||s.shown);
  let body='';
  if(it.type==='match'){const L=it.P.map((p,i)=>{const j=s.pairs[i];const on=s.sel===i&&!lock;
      return `<button type="button" class="thm-l${on?' on':''}" data-l="${i}" ${lock?'disabled':''} style="--pc:${PAIRC[i%8]}"><span class="thm-b">${ABC[i]}</span><span>${p[0]}</span>${R?mark(R[i]):''}</button>`;}).join('');
    const Rr=s.R.map(j=>{const li=Object.keys(s.pairs).find(l=>s.pairs[l]===j);return `<button type="button" class="thm-r${li!==undefined?' got':''}" data-r="${j}" ${lock?'disabled':''} ${li!==undefined?`style="--pc:${PAIRC[li%8]}"`:''}><span class="thm-b">${li!==undefined?ABC[li]:'·'}</span><span>${thRight(it,j)}</span></button>`;}).join('');
    body=`<p class="th-how">Chạm một mục có chữ cái (A, B, …), rồi chạm vế cần ghép với nó. Chạm lại vế đã ghép để bỏ ghép.</p><div class="thm"><div class="thm-c">${L}</div><div class="thm-c">${Rr}</div></div>
     ${R?`<ul class="th-why">${it.P.map((p,i)=>hint(i)?`<li>${mark(R[i])}<b>${ABC[i]}.</b> ${s.ok||s.shown?`${p[0]} ↔ ${p[1]}: `:''}${p[2]}</li>`:'').join('')}</ul>`:''}`;}
  if(it.type==='order'){body=`<p class="th-how">Dùng nút ▲ ▼ để đổi chỗ.</p><ol class="tho">${s.ord.map((i,k)=>`<li class="${R?(R[k]?'y':'n'):''}"><span class="tho-n">${k+1}</span><span class="tho-t">${it.I[i][0]}${(s.ok||s.shown)&&it.I[i][1]?`<small>${it.I[i][1]}</small>`:''}</span>${R?mark(R[k]):''}
      <span class="tho-b"><button type="button" class="btn small" data-up="${k}" ${lock||k===0?'disabled':''} aria-label="Lên">▲</button><button type="button" class="btn small" data-dn="${k}" ${lock||k===s.ord.length-1?'disabled':''} aria-label="Xuống">▼</button></span></li>`).join('')}</ol>
     <div class="tho-ax"><span>▲ ${it.a}</span><span>▼ ${it.z}</span></div>`;}
  if(it.type==='sort'){body=`<div class="ths">${s.ord.map(i=>{const x=it.I[i];return `<div class="ths-r${R?(R[i]?' y':' n'):''}"><p>${R?mark(R[i]):''}${x[0]}</p><div class="chips" role="group">${it.B.map((b,bi)=>`<button type="button" data-s="${i}" data-b="${bi}" aria-pressed="${s.pick[i]===bi}" ${lock?'disabled':''}>${b}</button>`).join('')}</div>${hint(i)?`<p class="th-w">${x[2]}</p>`:''}</div>`;}).join('')}</div>`;}
  if(it.type==='tf'){body=`<div class="ths">${it.S.map((x,i)=>{const p=s.pick[i];return `<div class="ths-r${R?(R[i]?' y':' n'):''}"><p>${R?mark(R[i]):''}${x[0]}</p>

      ${p===false?`<fieldset class="thf"><legend>Sửa lại cho đúng:</legend>${s.fo[i].map(j=>`<label><input type="radio" name="f-${it.id}-${i}" data-f="${i}" value="${j}" ${s.fix[i]===j?'checked':''} ${lock?'disabled':''}> <span>${x[3][j]}</span></label>`).join('')}</fieldset>`:''}
      ${hint(i)?`<p class="th-w">${x[1]?'Mệnh đề đúng. ':'Mệnh đề sai. '}${x[2]}</p>`:''}</div>`;}).join('')}</div>`;}
  const n=R?R.filter(Boolean).length:0,N=R?R.length:0;
